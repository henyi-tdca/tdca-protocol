  body: '[Diagnosis]

    Beyond the collision fix, this issue illustrates a structural gap: agents hold
    real credentials, yet secrecy here is procedural (best-effort redaction), not
    structural. Silent overwrite means a secret reaches LLM-visible text with no evidence
    trail of when or how.


    [TDCA angle]

    TDCA''s complementary angle: NSFL negative-space rules make ''secrets never enter
    LLM context'' a fail-closed boundary (violation halts, not logs); NCA attestation
    gives each sensitive-data access a tamper-evident, machine-readable record. Mounted
    outside your code - zero changes, full control stays with you.


    [Invitation]

    Welcome to compare notes in the TDCA repo Discussions - an invitation, not a request.'
