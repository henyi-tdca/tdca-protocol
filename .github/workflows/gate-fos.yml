# gate-fos —— L1-SI-137 门禁扩面 P1-1
name: gate-fos
on:
  workflow_dispatch:
  push:
    paths: ["tdca-fos/**", ".github/workflows/gate-fos.yml"]
  pull_request:
    paths: ["tdca-fos/**", ".github/workflows/gate-fos.yml"]
permissions:
  contents: read
jobs:
  test:
    name: tdca-fos 测试
    runs-on: [self-hosted, tdca-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install -U pip pytest
          if [ -f tdca-fos/requirements.txt ]; then pip install -r tdca-fos/requirements.txt; fi
      - name: 跑测试
        env:
          PYTHONPATH: ${{ github.workspace }}
          TDCA_KB_DIR: /opt/tdca-kb/tdca-official-kb
        working-directory: tdca-fos
        run: python -m pytest -q
