# gate-samesource —— TDCA-HANDOFF-EXEC-L1SI196-SAMESOURCE-001 同源派生校验 gate
#
# 只读对账门：站机公开文档面 vs 仓内白名单（git 对象），只报差。
# 独立作业（令面 §三：⛔ 并入既有全量跑，免拖慢）；手动 + 每周定时各一触发。
#
# 退出码：0 全过 / 1 有差 / 2 UNKNOWN（三分 ⛔ 混）。

name: gate-samesource

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"   # 每周一 03:23 UTC（+08 为周一 11:23，错开整半点）

jobs:
  samesource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1   # git show <rev>:<path> 足够（⛔ 读工作树）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 同源派生校验（只报差）
        run: python tools/ops/samesource_check.py --rev HEAD
        # 有差时 exit 1 置红（门之本义）；UNKNOWN exit 2 另行辨认
