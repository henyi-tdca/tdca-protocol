# TDCA Core Go — CI 门禁（DCD-CORE-GO-001 + 融入方案 I-3）
name: core-go-ci

on:
  push:
    paths: ["core-go/**", ".github/workflows/core-go-ci.yml"]
  pull_request:
    paths: ["core-go/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go vet
        working-directory: core-go
        run: go vet ./...

      - name: Go test (with race — 破坏性并发检测)
        working-directory: core-go
        run: go test -race -count=1 ./...

      - name: Build tdcad
        working-directory: core-go
        run: go build -o tdcad ./cmd/tdcad

      - name: CLI smoke
        working-directory: core-go
        run: ./tdcad version

      # --- 凭证绑定条例门禁（GSEQ-2805 施工 / GSEQ-2811 签批接入；只加严不放宽）---
      # credbind-check selftest：对 4 件核心工具规格跑 R2 规格洁净自扫；
      # 检出违规 exit 5、零扫描 exit 4——非 0 即 fail（零扫描即失守，fail-closed）。
      - name: Credbind spec-clean gate (selftest)
        working-directory: core-go
        run: |
          go build -o credbind-check ./cmd/credbind-check
          ./credbind-check selftest

      # --- 制度哈希清单校验（防篡改锚 ① 自动化——WorkBuddy VERIFY-EXT-2026-09-09 断链发现后增设）---
      # 依据: TDCA-SECURITY-TAMPER-001 ｜ INSTITUTION-HASHES.md（sha256 前 16 位）
      # 校验: AXIOM6-PROOF.md（证明文档）+ axiom6.go（实现）哈希与清单声称一致；
      #       失配即 fail——防「文件被改而清单未回填」静默断链重演。
      - name: Verify institution hashes (sha256 prefix · single source)
        working-directory: core-go
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          SRC = "docs/formal-proofs/INSTITUTION-HASHES.md"
          B, E = "<!-- INSTITUTION-HASHES-BEGIN -->", "<!-- INSTITUTION-HASHES-END -->"
          text = pathlib.Path(SRC).read_text(encoding="utf-8")
          if B not in text or E not in text:
              raise SystemExit("机读区块缺失：" + SRC)
          block = text.split(B, 1)[1].split(E, 1)[0]
          expected = {}
          for line in block.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              parts = line.split()
              if len(parts) != 2:
                  continue
              expected[parts[0]] = parts[1].upper()
          if not expected:
              raise SystemExit("机读区块解析为空：" + SRC)
          fails = []
          for rel, want in expected.items():
              h = hashlib.sha256(pathlib.Path(rel).read_bytes()).hexdigest().upper()[:16]
              if h != want:
                  fails.append(rel + ": 期望 " + want + " 实际 " + h)
          # 加严：人读表格中的哈希须与机读区块一致（同一文件内自检）
          table = text.split(B, 1)[0]
          for rel, want in expected.items():
              name = rel.rsplit("/", 1)[-1]
              if name in table and want not in table:
                  fails.append("清单人读表与机读区块不一致：" + name)
          if fails:
              raise SystemExit("INSTITUTION-HASHES 校验失败:\n" + "\n".join(fails))
          print("institution hashes OK (single source: " + SRC + ", " + str(len(expected)) + " 项)")
          PY

      # --- MCP 互操作常驻冒烟（官方第三方 SDK 独立验证，防互通倒退）---
      # 依据: TDCA-SMOKE-INTEROP-001 §六（阶段 2-B，GSEQ-1082）
      # 每次 core-go 变更须跑：官方 mcp SDK（非自研 client）连 tdcad mcp serve，
      # 验证 handshake/tools/enforce_check PASS——互通性不倒退门禁。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official MCP SDK
        run: pip install mcp pytest

      - name: MCP interop smoke (official 3P SDK)
        working-directory: core-go/bridge
        run: python smoke_mcp_thirdparty.py

      # --- Python bridge 单元测试（防 Python 客户端与 Go server 协议漂移）---
      # 依赖上方 Build tdcad 产物（bridge 客户端按 core-go/tdcad 定位二进制）。
      - name: Python bridge unit tests
        working-directory: core-go
        run: python -m pytest bridge/tests -q
