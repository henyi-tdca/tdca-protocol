# gate-seal —— TDCA-HANDOFF-EXEC-L1SI196-SEALCHECK-001 NCA 封块体检器
#
# 只读体检门：链尾对齐 / 重复块 / 签名滞后 / 缺日，只报差。
# 独立作业（令面 §四：⛔ 并入既有全量跑）；手动 + 每周定时各一触发。
#
# 退出码：0 全 OK / 1 有差 / 2 读数不可得（三分 ⛔ 混）。
# 数据面：封块与台账不在仓内（私域），CI 侧预期报「读数不可得」属设计内 UNKNOWN。

name: gate-seal

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"   # 每周一 03:41 UTC（+08 为周一 11:41，与 gate-samesource 03:23 错开）

jobs:
  sealcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: NCA 封块体检（只读）
        run: python tools/ops/nca_seal_check.py --nca-dir .tdca-nca
        # 数据面不在 CI 机时 exit 2（UNKNOWN），与有差（exit 1）分道辨认
