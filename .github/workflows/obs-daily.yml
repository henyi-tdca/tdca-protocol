name: daily-obs
on:
  schedule:
    - cron: '7 0 * * *'   # UTC 00:07 = 北京时间 08:07
  workflow_dispatch: {}    # 手动触发备查

jobs:
  obs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 观察检查
        run: |
          echo "=== A 组：仓库信号 ==="
          curl -s https://api.github.com/repos/henyi-tdca/tdca-protocol | \
            jq '{star:.stargazers_count, fork:.forks_count, watchers:.subscribers_count, issues:.open_issues_count}'
          echo "=== B 组：Issue/PR ==="
          curl -s "https://api.github.com/repos/henyi-tdca/tdca-protocol/issues?state=all&per_page=5" | \
            jq '[.[] | {n:.number, state:.state, title:.title}]'
          echo "=== C-1：README 可达 ==="
          curl -s -o /dev/null -w "readme_http=%{http_code}\n" \
            https://raw.githubusercontent.com/henyi-tdca/tdca-protocol/main/README.md
          echo "=== C-3：Gitee 审核 ==="
          GITEE_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
            https://gitee.com/siweihanshuzhineng/tdca-protocol)
          echo "gitee_http=$GITEE_HTTP"
          if [ "$GITEE_HTTP" = "200" ]; then
            echo "⚠️ Gitee 审核生效——触发闸 3b 镜像推送 + 补登记"
            exit 1   # fail 标记以引起注意
          fi
      - name: 社区算力消耗（熔断观察——NCA-065，阈值日¥2/月¥8）
        if: always()
        run: |
          echo "=== D 组：社区算力消耗（tdca-community-playground 台账）==="
          TODAY=$(date -u +%Y%m%d); MONTH=$(date -u +%Y%m)
          export TODAY MONTH
          python3 - <<'PYEOF'
          import base64, json, os, sys, urllib.request
          H = {"Accept": "application/vnd.github+json", "User-Agent": "tdca-daily-obs"}
          def get(u):
              req = urllib.request.Request(u, headers=H)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.loads(r.read().decode())
          today, month = os.environ["TODAY"], os.environ["MONTH"]
          try:
              tree = get("https://api.github.com/repos/henyi-tdca/tdca-community-playground/git/trees/main?recursive=1")
          except Exception as e:
              print("playground 台账不可达（可能尚未首跑）:", e)
              sys.exit(0)
          files = [t["path"] for t in tree.get("tree", []) if t["path"].startswith(".tdca-nca/services/community/NCA-COMMUNITY-")]
          day_sum = mon_sum = 0.0
          for p in files:
              base = os.path.basename(p)
              if f"NCA-COMMUNITY-{month}" not in base:
                  continue
              try:
                  c = json.loads(base64.b64decode(get("https://api.github.com/repos/henyi-tdca/tdca-community-playground/contents/" + p)["content"]).decode())
                  v = float(c.get("est_cost_cny", 0))
                  mon_sum += v
                  if f"NCA-COMMUNITY-{today}" in base:
                      day_sum += v
              except Exception:
                  pass
          print(f"台账文件 {len(files)} 个｜今日 ¥{day_sum:.4f}｜本月 ¥{mon_sum:.4f}（阈值: 日 ¥2 / 月 ¥8）")
          if day_sum > 2 or mon_sum > 8:
              print("::error::社区算力超限（日¥2/月¥8）——请吊销换新 Key（NCA-065 熔断条款）")
              sys.exit(1)
          PYEOF
