# DUALCOPY-FIX-001 步2：双副本漂移门（11 组 WARN 级；
# INVSOLVER-README-001 第 3 事起第 12 组 tdca-utility-genie 对为阻断级）
name: dualcopy-drift-gate
on:
  workflow_dispatch:
  push:
    paths: ["tools/**", "tdca-toolchain/**", "tdca-flow-orchestrator/**",
            "tdca-utility-genie/**", "true-source/**",
            ".github/workflows/dualcopy-drift-gate.yml",
            ".github/scripts/dualcopy_drift_check.py"]
  pull_request:
    paths: ["tools/**", "tdca-toolchain/**", "tdca-flow-orchestrator/**",
            "tdca-utility-genie/**", "true-source/**",
            ".github/workflows/dualcopy-drift-gate.yml",
            ".github/scripts/dualcopy_drift_check.py"]
permissions:
  contents: read
jobs:
  drift:
    name: 双副本同路径漂移检查（11 组 WARN ＋ tdca-utility-genie 组阻断）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 漂移检查（WARN 组只报告；阻断组新增漂移即红）
        run: python .github/scripts/dualcopy_drift_check.py
