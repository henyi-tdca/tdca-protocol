# DUALCOPY-FIX-001 步2：双副本漂移门（WARN 级，不阻断合并；工具上架前须清零）
name: dualcopy-drift-gate
on:
  workflow_dispatch:
  push:
    paths: ["tools/**", "tdca-toolchain/**", "tdca-flow-orchestrator/**",
            ".github/workflows/dualcopy-drift-gate.yml",
            ".github/scripts/dualcopy_drift_check.py"]
  pull_request:
    paths: ["tools/**", "tdca-toolchain/**", "tdca-flow-orchestrator/**",
            ".github/workflows/dualcopy-drift-gate.yml",
            ".github/scripts/dualcopy_drift_check.py"]
permissions:
  contents: read
jobs:
  drift:
    name: 11 组双副本同路径漂移检查（WARN）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 漂移检查（WARN 级，退出码恒 0）
        run: python .github/scripts/dualcopy_drift_check.py
