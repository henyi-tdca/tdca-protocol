<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TDCA 教学模拟器 — E-EDU-4.2 实训界面</title>
<!--
  E-EDU-4.2 前端集成（基础版/进阶版实训界面）
  Tier 2: CDN + Babel（与 Phase B / EIOS 同栈）
  复用 UI-001~007 视觉规范（HC 同构）：
    UI-002（L4 意图编辑器）→ 实训一 六要素编辑器
    UI-007（拓扑穿越）      → 实训二 9 Phase 流程视图
    UI-005（L1 实时监控）   → 实训三 NCA 审计面板
    UI-003（L3 控制台）     → 实训三 MOU 结算面板
  后端对接: edu_simulator.py（UnlockEngine/TrainingOrchestrator，原型 mock 先行）
  制度约束: 四级解锁能级 / NSFL 关键词可见不可改 / 9 Phase 不可跳过 / MOU 与生产一致
  模拟态: 通知机硬件未投产部署；本界面为教学模拟，不构成真实部署。
-->
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  /* Phase B 五层视觉规范复用 */
  :root { --L5:#8B0000; --L4:#FF8C00; --L3:#FFD700; --L2:#228B22; --L1:#0000CD; }
  body { font-family:'Segoe UI','PingFang SC',sans-serif; margin:0; background:#f8f9fa; }
  .app { min-height:100vh; padding:16px; max-width:1100px; margin:0 auto; }
  .nav { display:flex; align-items:center; gap:10px; padding:12px; background:#fff;
         border-radius:8px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.1); }
  .nav .title { font-weight:700; }
  .nav .sub { color:#666; font-size:13px; }
  .card { background:#fff; border-radius:8px; padding:16px; margin-bottom:16px;
          box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card h3 { margin:0 0 12px; font-size:15px; }

  /* 能级状态（四级解锁） */
  .tiers { display:flex; gap:8px; margin-bottom:16px; }
  .tier { flex:1; text-align:center; padding:10px 4px; border-radius:8px; font-size:13px;
          background:#e9ecef; color:#666; border:2px solid transparent; }
  .tier.locked { opacity:.5; }
  .tier.unlocked { background:#fff; border-color:var(--L2); color:var(--L2); font-weight:700; }
  .tier.current { background:var(--L3); border-color:var(--L3); color:#333; }

  /* UI-002 六要素编辑器（L4 意图层） */
  .editor { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .editor label { display:block; font-size:12px; color:#666; margin-bottom:4px; }
  .editor input, .editor textarea { width:100%; border:2px solid var(--L4); border-radius:6px;
                                    padding:8px; box-sizing:border-box; font-size:13px; }
  .editor .locked { border-color:#dc3545; background:#fff5f5; color:#dc3545; }

  /* UI-007 9 Phase 流程 */
  .timeline { display:flex; align-items:center; gap:2px; margin:12px 0; flex-wrap:wrap; }
  .tl-node { width:34px; height:34px; border-radius:50%; display:flex; align-items:center;
             justify-content:center; font-size:10px; font-weight:700; background:#e9ecef;
             color:#666; border:2px solid #ccc; }
  .tl-node.done { background:var(--L2); border-color:var(--L2); color:#fff; }
  .tl-node.cur { background:var(--L3); border-color:var(--L3); color:#333; transform:scale(1.15); }
  .tl-node.fused { background:#dc3545; border-color:#dc3545; color:#fff; }
  .tl-arrow { color:#999; font-size:10px; }

  /* UI-005 NCA 审计（L1 黑底绿字） */
  .l1 { background:#0A0A0A; color:#00FF88; font-family:monospace; border-radius:0; }
  .l1 h3 { color:#00FF88; }
  .l1-line { font-size:12px; line-height:1.7; border-bottom:1px solid #1c3a2a; }

  /* UI-003 MOU 结算（L3 金色） */
  .l3 { background:#FFF8DC; border:1px solid var(--L3); }
  .l3 h3 { color:#d4a017; }
  .mou-total { font-size:26px; font-weight:700; color:#d4a017; margin:8px 0; }

  .btn { padding:8px 18px; background:var(--L3); border:none; border-radius:6px;
         cursor:pointer; font-weight:600; margin-top:10px; }
  .btn:disabled { background:#ccc; cursor:not-allowed; }
  .hint { color:#888; font-size:12px; margin-top:6px; }
  .blocked { background:#dc3545; color:#fff; padding:8px 12px; border-radius:4px; margin-top:8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

// ============ mock 后端（对接 edu_simulator.py 逻辑） ============
const PHASES = ['P0','P1','P2','P3','P4','P5','P6','P7','P8','COMPLETED'];
const NSFL_LOCKED = ['诈骗类调用', '违法请求', '深度伪造'];
const TIER_ORDER = ['认知版', '基础版', '进阶版', '专家版'];
const TIER_REQ = { 基础版:'完成认知版测验', 进阶版:'完成 3 个基础案例', 专家版:'完成 5 个进阶案例 + 考试' };

// ============ 能级状态 ============
function TierBar({ tier }) {
  return (
    <div className="tiers">
      {TIER_ORDER.map((t, i) => {
        const cur = TIER_ORDER.indexOf(tier);
        const cls = i === cur ? 'current' : (i < cur ? 'unlocked' : 'locked');
        return <div key={t} className={'tier ' + cls}>{t}</div>;
      })}
    </div>
  );
}

// ============ 实训一：六要素编辑器（UI-002，基础版） ============
function Scenario1Editor({ tier }) {
  const basic = tier === '认知版' || tier === '基础版';
  return (
    <div className="card">
      <h3>实训一：创建你的第一个智能体（UI-002 六要素编辑器 · 基础版）</h3>
      {tier === '认知版' && <div className="blocked">认知版仅观摩——完成测验后解锁基础版操作</div>}
      <div className="editor">
        <div><label>目标函数（自然语言）</label>
          <input disabled={tier === '认知版'} placeholder="例：帮我筛选可信来电" /></div>
        <div><label>配置权边界</label>
          <input disabled={tier === '认知版'} placeholder="例：仅家庭场景可调用" /></div>
        <div><label>约束矩阵（NSFL 关键词可见不可改）</label>
          {NSFL_LOCKED.map(k => (
            <input key={k} className="locked" value={k} readOnly title="NSFL 锁定，不可修改" />
          ))}
          <input disabled={tier === '认知版'} placeholder="可添加约束（不可含锁定词）" /></div>
        <div><label>预期分配</label>
          <input disabled={tier === '认知版'} placeholder="例：6:4" /></div>
      </div>
      <button className="btn" disabled={tier === '认知版'} onClick={() => alert('六要素声明完成 → 生成 NCA（原型）')}>
        声明六要素
      </button>
      {basic && <div className="hint">基础版：六要素简化模板，NSFL 关键词可见不可改</div>}
    </div>
  );
}

// ============ 实训二：9 Phase 流程视图（UI-007，进阶版） ============
function Scenario2NinePhase({ tier }) {
  const [cur, setCur] = useState(0);
  const advanced = tier === '进阶版' || tier === '专家版';
  return (
    <div className="card">
      <h3>实训二：9 Phase 全流程（UI-007 拓扑穿越 · 不可跳过）</h3>
      {!advanced && <div className="blocked">进阶版实训需完成 3 个基础案例（当前：{tier}）</div>}
      <div className="timeline">
        {PHASES.map((p, i) => (
          <span key={p} style={{ display:'flex', alignItems:'center' }}>
            <span className={`tl-node ${i < cur ? 'done' : i === cur ? 'cur' : ''}`}>{p}</span>
            {i < PHASES.length - 1 && <span className="tl-arrow">▶</span>}
          </span>
        ))}
      </div>
      <button className="btn" disabled={!advanced || cur >= PHASES.length - 1}
        onClick={() => setCur(c => c + 1)}>
        推进 Phase（当前 P{cur}）
      </button>
      <div className="hint">流程必须走完，不可跳过（复用 ASP 破例识别偏离检测语义）</div>
    </div>
  );
}

// ============ 实训三：NCA 审计 + MOU 结算（UI-005 + UI-003，进阶版） ============
function Scenario3NcaMou({ tier }) {
  const [mou, setMou] = useState(null);
  const advanced = tier === '进阶版' || tier === '专家版';
  const ncas = [
    { id:'NCA-STU-P0', t:'10:01', evt:'意图孕育' },
    { id:'NCA-STU-P2', t:'10:03', evt:'协议编译' },
    { id:'NCA-STU-P4', t:'10:05', evt:'节点锚定' },
    { id:'NCA-STU-P8', t:'10:08', evt:'智能合约交付' },
  ];
  return (
    <div className="card l1">
      <h3>实训三：NCA 审计轨迹（UI-005 L1 · 只读不可篡改）</h3>
      {!advanced && <div className="blocked">进阶版实训需完成 3 个基础案例</div>}
      {ncas.map(n => (
        <div className="l1-line" key={n.id}>[{n.t}] {n.id} — {n.evt}</div>
      ))}
      <div className="card l3" style={{ marginTop:12 }}>
        <h3>MOU 结算（UI-003 L3 · 逻辑与生产一致：进项 6% + 出项 10%）</h3>
        <div className="mou-total">¥ {mou === null ? '—' : mou}</div>
        <button className="btn" disabled={!advanced}
          onClick={() => setMou((100 * 0.06 + 50 * 0.10).toFixed(2))}>
          计算 MOU（进项 100 / 出项 50）
        </button>
        <div className="hint">MOU = 进项×6% + 出项×10% = 11.00；MOU 是计算的，不是宣称的</div>
      </div>
    </div>
  );
}

// ============ 实训四：多智能体（专家版） ============
function Scenario4Multi({ tier }) {
  const expert = tier === '专家版';
  return (
    <div className="card">
      <h3>实训四：多智能体协作（CKS 同步 · 基变换 · 专家版）</h3>
      {!expert && <div className="blocked">专家版实训需完成 5 个进阶案例 + 考试（当前：{tier}）</div>}
      {expert && <div>
        <div className="hint">✅ CKS 宪法收敛（R2 人类签名权 &gt; R1 正和）</div>
        <div className="hint">✅ 基变换（K2.6 → K3，记忆迁移四约束）</div>
        <button className="btn" onClick={() => alert('多智能体协作完成 → 生成嵌套 NCA（原型）')}>
          运行协作
        </button>
      </div>}
    </div>
  );
}

// ============ 应用 ============
function App() {
  const [tier, setTier] = useState('认知版');
  return (
    <div className="app">
      <div className="nav">
        <span className="title">TDCA 教学模拟器</span>
        <span className="sub">E-EDU-4.2 实训界面 · 复用 UI-001~007 视觉规范 · 制度同构（NCA/9Phase/MOU 与生产一致）</span>
      </div>
      <TierBar tier={tier} />
      <div className="hint" style={{ marginBottom: 12 }}>
        当前能级：<b>{tier}</b>（{TIER_REQ[tier] || '注册即解锁：纯观摩'}）——
        <button className="btn" style={{ marginLeft: 8, padding: '2px 10px' }} onClick={() => {
          const next = TIER_ORDER[Math.min(TIER_ORDER.indexOf(tier) + 1, 3)];
          setTier(next);
        }}>模拟解锁下一级（演示）</button>
      </div>
      <Scenario1Editor tier={tier} />
      <Scenario2NinePhase tier={tier} />
      <Scenario3NcaMou tier={tier} />
      <Scenario4Multi tier={tier} />
      <div className="hint" style={{ marginTop: 12 }}>
        后端对接: edu_simulator.py（UnlockEngine / TrainingOrchestrator / NSFLGuard）· 部署: frontend/edu-simulator/
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
