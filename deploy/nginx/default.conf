server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /mcp/ {
        proxy_pass http://mcp-bridge:8001/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
