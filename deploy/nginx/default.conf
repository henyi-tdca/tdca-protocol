# 2026-10-09 复验件：关版本号外显（不改任何访问闸语义）
server_tokens off;
# ── SITE-WALK-002：前端路由白名单（2026-10-19）──
# ⭐ 派生自仓内前端路由表（tdca-frontend/src/pages/pages.tsx PAGE_META 45 路 + App.tsx /channel/* 与 /docs/:family*）；
# 用于 @spa 兜底判定：白名单内回 SPA 壳，其余真 404（消灭通配兜底假 200）。
map $uri $tdca_front_route {
    default 0;
    ~*^/$ 1;
    ~*^/(about|academy|agent-shelf|agents|anchors|announcements|attestation|assets|audit|auth|authorization-registry|channel|cluster|contribute|demo|disclosure|docs|formal|governance|help|lab|library|market|market-sim|me|nca-guide|negativespace|nodes|notifier|official-assets|ops|ownership|ownership-registry|private|process|register|review|rules|sandbox|search|start|status|studio|tax|terms|toolshelf|use|verify|workbuddy)(/|$) 1;
}
# ── L1SI182-BATCH-002 §三：收录开关（map $request_uri $seo_robots，2026-10-30）──
# 默认谢绝（noindex, nofollow）；开放面置空 = 不发送 X-Robots-Tag；
# 键取 $request_uri（原始请求地址，⛔不可用 $uri：try_files/rewrite 回退 index.html 后 $uri 恒为 /index.html，
# 开面判定会整体失效——部署核验实测捕获）；尾型 (\?.*)? 容忍查询串；
# 开面清单须与 tdca-frontend/src/app/seo-robots.tsx 的 SEO_OPEN_FACES 逐字一致（⛔两套）。
map $request_uri $seo_robots {
    default "noindex, nofollow";
    ~*^/(\?.*)?$ "";
    ~*^/about/?(\?.*)?$ "";
    ~*^/audit/?(\?.*)?$ "";
    ~*^/agents/?(\?.*)?$ "";
    ~*^/academy/?(\?.*)?$ "";
    ~*^/attestation/?(\?.*)?$ "";
    ~*^/docs/regulation/?(\?.*)?$ "";
    ~*^/library/?(\?.*)?$ "";
    ~*^/docs/whitepapers/?(\?.*)?$ "";
    ~*^/docs/papers/?(\?.*)?$ "";
}
# tdca-site nginx 面（TLS 版·G-4 接线）
# 结构：listen 88（对外 80→301 跳 HTTPS）；listen 443 ssl（正式 HTTPS 面）；
#       listen 80（原主站语义，容器内供 8080 内部调试口，零改动）
# 访问控制照守：443 面 basic auth 与原 80 面完全一致；API 面 auth_basic off 语义不动。
server {
    listen 88;
    server_name _;

    # 对外 80 口（映射至本 88）：一律 301 至 HTTPS
    # ACME 续期挑战直放（certbot webroot；仅 .well-known 一路，2026-10-17 创始人明示装 certbot 所加）
    location /.well-known/acme-challenge/ {
        root /usr/share/tdca-site;
    }
    location / {
        return 301 https://tdca.com.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tdca.com.cn.pem;
    ssl_certificate_key /etc/nginx/tls/tdca.com.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── 期 1 全站 basic auth 已于 2026-10-17 撤除（建设期口令门·全开经创始人明示·GATE-OFF-001/TERM-FIX-DEPLOY-GATEOFF-001）；gateway 应用层口令门照旧 ──
    # ── L1SI182-BATCH-002 §三：收录开关（默认谢绝；开放面经 map $request_uri $seo_robots 置空不头发；与页内 meta 同一张开面表）──
    add_header X-Robots-Tag "$seo_robots" always;
    # ── L1SI182-BATCH-002 §四：上传受理上限 520m（覆盖在册最大类 500MB＋表单余量；⛔不设无限、⛔只改此一项）──
    client_max_body_size 520m;
    # ── SITE-WALK-002：安全头五项（2026-10-19，扩授权 §一.3）──
    # CSP 取值理由：首页 index.html 含 1 段 inline 引导脚本（裸路径直达改写）+ JSON-LD（非可执行），
    # 故 script-src 暂含 'unsafe-inline'（先宽松后收紧，另案）；WS 走同源 wss:/ws:。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # ── OPS-PAGE-GATE-001：运维页面门撤除（2026-10-17）──
    # 改由站点账号＋角色把关：页面壳公开（壳内不含数据），数据仍由 /api/v1/ops/* 判角色（未登录 401／非运维 403）
    location ~ ^/(ops|review)(/|$) {
        root /usr/share/tdca-site;
        rewrite ^ /index.html break;
    }
    # ── 运维端基础文件区（已撤·2026-10-17 INACCOUNT-DEPLOY I 步）：接口出件取代静态独立口令门；
    # 本块留 404 墓碑——防 SPA 回退壳把该路伪报 200（撤后验证 J：必不为 200、未登录取不到任何件）──
    location ^~ /ops/files/ {
        return 404;
    }
    # ── PUB-060 发现层直出（2026-10-19，创始人放行·仅授权此两条精确 location）──
    # llms.txt / robots.txt 直出静态件，防 SPA 兜底假 200；
    # 本两块自带 add_header 覆写 server 级 noindex（仅及此两路，不动他处）
    location = /llms.txt {
        root /usr/share/tdca-ops-files/public-static;
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /robots.txt {
        root /usr/share/tdca-ops-files/public-static;
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
        # ── SITEMAP-001：sitemap 精确直出（2026-10-19，照四静态件同待遇）──
    # 以容器内 /usr/share/tdca-ops-files（宿主挂载的 public-static 目录）为准，不随 dist 换发漂移
    location = /sitemap.xml {
        root /usr/share/tdca-ops-files/public-static;
        default_type text/xml;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

# ── SITE-WALK-002：favicon / manifest 精确直出（防 SPA 兜底假 200）──
    location = /favicon.ico {
        root /usr/share/tdca-ops-files/public-static;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /manifest.json {
        root /usr/share/tdca-ops-files/public-static;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # TRI-MERGE-001 补修：docs 静态族目录遮蔽 SPA 裸路径（裸路径与尾斜杠形回退 SPA 壳）
    # L1SI182-BATCH-002：本块 X-Robots-Tag 随收录开关走 $seo_robots（/docs/regulation、/docs/whitepapers、/docs/papers 开放面不头发，其余谢绝）
    location ~ ^/docs(/(regulation|papers|whitepapers))?/?$ {
        root /usr/share/tdca-site;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "$seo_robots" always;
    }

    # tdca-site SPA（SITE-WALK-002 改：静态件直落；白名单路由回壳；其余真 404）
    location / {
        root /usr/share/tdca-site;
        try_files $uri $uri/ @spa;
    }
    location @spa {
        default_type application/json;
        if ($tdca_front_route = 0) {
            return 404 '{"detail":"Not Found（该端点未上线或不存在）","code":"TDCA-E-ASSET-STATE-001"}';
        }
        root /usr/share/tdca-site;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "$seo_robots" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 旧门户（挂账观察，期 1 仍可达）
    location /portal/ {
        alias /usr/share/nginx/html/;
        index index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }


    # tdca-site API 面（期 1 新增白名单项，挂 gateway /api/site/*）
    # basic auth 关：该面由应用口令门＋gateway B-4 双层鉴权（Authorization 头须留给 TDCA-CRT/SES）
    location /api/site/ {
        auth_basic off;
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        default_type application/json;
    }

    # intent exact route -> nl sidecar (added 2026-10-16, exec-side, authorized)
    location = /api/v1/intent {
        auth_basic off;
        proxy_pass http://nl:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # 已知 API 端点白名单（原表＋上方 site 面）
    location ~ ^/api/(v1/(authorization|market-admin|system|tax|config-right|assets|knowledge|audit|sandbox|genie|governance|notifier|eios|attestation|auth|me|agents|intent|workbuddy|cluster|formal|toolshelf|use|ci|anchor|agent-channel|ops|ownership|regulations|market-sim|library|announcements|selfcheck)|search|edu|agents|health|public)(/|$) {
        auth_basic off;  # 期 1：Authorization 头留给 TDCA-SES/CRT（照 /api/site/ 先例）
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        default_type application/json;
        if ($upstream_http_content_type ~* "text/html") {
            return 404 '{"error":"NOT_FOUND"}';
        }
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND"}';
    }

    location /mcp/ {
        proxy_pass http://mcp-bridge:8001/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location ~ ^/(health|handshake|nca|nsfl|cross-scene|workflow)(/|$) {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /ws {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# ── 内部调试口（容器 80，经宿主机 8080，语义与原配置逐字一致，零改动）──
server {
    listen 80;
    server_name _;

    auth_basic "tdca-site internal";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        root /usr/share/tdca-site;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /portal/ {
        alias /usr/share/nginx/html/;
        index index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }


    location /api/site/ {
        auth_basic off;
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        default_type application/json;
    }

    location ~ ^/api/(v1/(authorization|market-admin|system|tax|config-right|assets|knowledge|audit|sandbox|genie|governance|notifier|eios|attestation|auth|me|agents|intent|workbuddy|cluster|formal|toolshelf|use|ci|anchor|agent-channel|ops|ownership|regulations|market-sim|library|announcements|selfcheck)|search|edu|agents|health|public)(/|$) {
        auth_basic off;
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        default_type application/json;
        if ($upstream_http_content_type ~* "text/html") {
            return 404 '{"error":"NOT_FOUND"}';
        }
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND"}';
    }

    location /mcp/ {
