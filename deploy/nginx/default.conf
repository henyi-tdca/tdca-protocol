server {
    listen 80;
    server_name _;

    # 门户（三栏）：仅精确根路径（GSEQ-0640）
    # 注：此处必须用 try_files 直出——index 指令会内部重定向 /index.html 被 location / 抢走
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        # GSEQ-0779 追加：门户更新频繁，禁启发式缓存——每次回源校验（不变 304，零性能负担），防旧版残留（2026-08-31 创始人浏览器旧缓存事件）
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # NL 意图导航：DeepSeek 真实算力边车（GSEQ-0645），fail 降级回 gateway 规则表
    location = /api/v1/intent {
        proxy_pass http://nl:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # 已知 API 端点白名单（源自 gateway FROZEN 路由表 28 条/16 组 + bridge 面）→ 反代
    # 注：location = /api/v1/intent 精确匹配优先于本正则，仍走 NL 边车不受影响
    location ~ ^/api/(v1/(system|tax|config-right|assets|knowledge|audit|sandbox|genie|governance|notifier|eios|attestation|auth|me|agents|intent)|search|edu|agents|health)(/|$) {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        # 保留段（创始人裁定 2026-09-10）：上游 SPA 兜底返回 200 + text/html 时改判 404 的设想
        # 实测不生效（nginx if 在 rewrite 阶段求值，上游变量恒空）——惰性零副作用，留档备查
        default_type application/json;
        if ($upstream_http_content_type ~* "text/html") {
            return 404 '{"error":"NOT_FOUND"}';
        }
    }

    # 其余 /api/ 路径：JSON 404（fail-closed——未知端点不得回退 SPA 壳）
    # 解冻新增路由时需同步上方白名单（列入解封检查单）
    location /api/ {
        default_type application/json;
        return 404 '{"error":"NOT_FOUND"}';
    }

    location /mcp/ {
        proxy_pass http://mcp-bridge:8001/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # M4 应用侧扩展端点（SPA 消费的 B/A 接口面，GSEQ-0659）
    location ~ ^/(health|handshake|nca|nsfl|cross-scene|workflow)(/|$) {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /ws {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # M4 应用侧 SPA（web 服务：封板 dist，路由回退在 web 内部处理）
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
