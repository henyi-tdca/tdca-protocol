# TDCA Core Go — CI 门禁（DCD-CORE-GO-001 + 融入方案 I-3）
name: core-go-ci

on:
  push:
    paths: ["core-go/**", ".github/workflows/core-go-ci.yml"]
  pull_request:
    paths: ["core-go/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go vet
        working-directory: core-go
        run: go vet ./...

      - name: Go test (with race — 破坏性并发检测)
        working-directory: core-go
        run: go test -race -count=1 ./...

      - name: Build tdcad
        working-directory: core-go
        run: go build -o tdcad ./cmd/tdcad

      - name: CLI smoke
        working-directory: core-go
        run: ./tdcad version
