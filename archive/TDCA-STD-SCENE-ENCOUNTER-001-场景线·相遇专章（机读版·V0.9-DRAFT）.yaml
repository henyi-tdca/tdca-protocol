# 指针行（ENC-REPO-001 入仓加注）：本件所引 enforce R1~R10 ＝ tools/enforce_entry.py
doc_id: 'TDCA-STD-SCENE-ENCOUNTER-001'
title: '场景线·相遇专章'
version: 'V0.9-DRAFT'
status: 'pending-signoff'
nature: '条例（制度性体裁）'
semantic_authority: 'human-read-version'
side: 'reasonix'
date: '2026-10-06'
timezone: '+08'
note: '机读版；⛔ 不得反向改语义；经授权方签批后生效'
program_basis:
  step1_research: 'registered'
  step2_govkit: 'registered'
  step3_assert: 'registered'
  step4_sandbox: 'registered'
authority_chain:
  - 'TDCA-RULING-PRP-ENC-001-005（三缝全并场景线·缝②落场景专章）'
  - 'TDCA-RULING-PRP-ENC-001-006（相遇双向奔赴·只有是否发生）'

definitions:
  encounter:
    text: '信息公开、制度公开之下自然发生之双向奔赴匹配事件'
    cost: 'free'
    position: '场景内交互之第一环'
    domain: '场景（相遇必有场景）'
  matchmaking:
    text: '主动服务'
    cost: 'charged'
    anchor: 'matchmaking'

chapters:
  - no: 1
    title: '总则'
    articles:
      - no: 1
        title: '目的'
        text: '把相遇落地为可判接口，使缔约前主体匹配有据可依、可查、可追索'
      - no: 2
        title: '依据'
        text: '转正四步（智库→治理包→断言→沙盒）四步件'
      - no: 3
        title: '适用范围'
        text: '场景线内之主体匹配（相遇）；不适用于撮合服务（另线）'
      - no: 4
        title: '定义'
        text: '相遇＝信息公开、制度公开之下自然发生之双向奔赴匹配事件（免费）；撮合＝主动服务（收费）'
  - no: 2
    title: '相遇与撮合之划界（缝①）'
    articles:
      - no: 5
        title: '并列不互推'
        text: '相遇与撮合非同一；不得互为指代'
      - no: 6
        title: '收费边界'
        text: '撮合服务费照收；相遇本身不收费；不得设相遇入口费/流量计价/曝光计费'
      - no: 7
        title: '场景为先'
        text: '相遇必有场景；无场景之相遇不成立；为特定相遇可构建相应场景'
  - no: 3
    title: '相遇「是否发生」之存证（缝②·专节）'
    articles:
      - no: 8
        title: '二分'
        text: '相遇存证状态 ∈ {发生, 未发生}；不设真假相遇判定'
      - no: 9
        title: '未发生之记法'
        text: '未发生者如实记「未发生」；不加罚则、不计信用后果'
      - no: 10
        title: '存证口径'
        text: '同链存证；口径与在册 NCA 一致（可复用七字段）'
  - no: 4
    title: '相遇流程与状态机（缝③）'
    articles:
      - no: 11
        title: '三态'
        text: '发现 → 相遇 → 握手'
      - no: 12
        title: '迁移与回退'
        text: '合法迁移限于规定集；含回退；其余一律拒'
      - no: 13
        title: '禁则'
        text: '未握手不得调配置权（引用 CCP 越级阻断）；门禁引用 R1~R10，不新增'
      - no: 14
        title: '发现阶段之限'
        text: '发现仅产出线索；不得以可见性/引用分作相遇依据'
  - no: 5
    title: '附则'
    articles:
      - no: 15
        title: '双版本'
        text: '配套机读版（同批）；人读版为语义权威'
      - no: 16
        title: '术语'
        text: '「相遇」作表述纳入场景线；不另立独立术语'
      - no: 17
        title: '生效'
        text: '经授权方签批后生效'

machine_fields:
  encounter_status:
    allowed: ['发生', '未发生']
    forbidden: ['INVALID', '真相遇', '假相遇']
  states: ['发现', '相遇', '握手', '交互', '结算', '拒绝']
  legal_transitions:
    - ['发现', '相遇']
    - ['相遇', '握手']
    - ['握手', '交互']
    - ['交互', '结算']
    - ['相遇', '发现']
    - ['握手', '相遇']
    - ['握手', '拒绝']
    - ['相遇', '拒绝']
  config_call_requires_states: ['握手', '交互', '结算']
  gates:
    allowed: ['R1', 'R2', 'R3', 'R4', 'R5', 'R6', 'R7', 'R8', 'R9', 'R10']
    forbidden_add: ['R11']
  fee_rules:
    encounter_fee: 'forbidden'
    matchmaking_fee: 'allowed'

verification:
  asserts: ['A-1a', 'A-1b', 'A-1c', 'A-2a', 'A-2b', 'A-2c', 'A-3a', 'A-3b', 'A-3c', 'A-3d', 'A-4a', 'A-4b']
  assert_result: '12/12 PASS (EXIT=0, 本机机验·CI待开通)'
  sandbox_checks: ['S-1', 'S-1b', 'S-2', 'S-2b', 'S-3', 'S-4', 'S-5']
  sandbox_result: '7/7 PASS (EXIT=0, 本侧仿真·有限模型穷举)'

boundary:
  - '未生效（待签批）'
  - '未改任何在册件（追加制）'
  - '零对外；未推未合并未署未登录未转交'
  - '不含凭据值与人名'
