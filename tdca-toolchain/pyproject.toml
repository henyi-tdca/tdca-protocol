[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tdca-toolchain"
version = "1.0.0"
description = "TDCA 协议配置网络工具链（Token/NCA/MOU/Verify）"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
tdca-tool = "tdca_tool:main"

[tool.setuptools]
packages = ["cog_align", "cypress_pool", "dca_sandbox", "maka_nca", "merchant_loop", "paperclip_nca", "pi_nca", "thingsboard_pool", "util_value", "value_services"]
py-modules = ["tdca_cognitive_distance", "tdca_cognitive_state", "tdca_constraint_interpreter", "tdca_function_compiler", "tdca_fuzzy_distance", "tdca_mou_recorder", "tdca_output_validator", "tdca_tool", "tdca_verify_chain"]
