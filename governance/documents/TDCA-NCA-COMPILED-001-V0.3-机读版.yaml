# TDCA-NCA-COMPILED-001 · 机读版 · V0.3-COMPILED
# 同编号同版本号；人读版为语义权威；按判据 2 同批产出（规范类双版本）
# ⚠️ 状态 PENDING-VERIFICATION；⛔ 未生效；⛔ 不得称正式制度（未走转正四步；R-4 暂不升）
standard:
  id: TDCA-NCA-COMPILED-001
  title_zh: NCA 制度合一版
  version: V0.3-COMPILED
  status: PENDING-VERIFICATION
  effective: null
  created_in_session: L1-SI-057
  drafted_by: Reasonix
  kind: composite
  date: '2026-09-19'
  timezone: '+08'
  supersedes: TDCA-NCA-COMPILED-001 V0.2-COMPILED
  merges: [TDCA-RULING-NCA-COMPILED-001-001, TDCA-WITNESS-NCA-COMPILED-001]
  merges_note: 本版并入四项裁定（R-1~R-4）与只读侧核证成立之六项遗漏（M-1~M-6）；⛔ 原件与旧版一字不回改，冲突以本件为准
  human_versions:
    zh:
      file: tdca-thinktank/governance/documents/TDCA-NCA-COMPILED-001-V0.3-NCA制度合一版（并入四项裁定与六项遗漏·待核查）.md
