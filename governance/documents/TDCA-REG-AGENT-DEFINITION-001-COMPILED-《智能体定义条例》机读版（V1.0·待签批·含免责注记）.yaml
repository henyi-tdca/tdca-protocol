founder_verbatim:
  - "好了，关于智能体的定义，我想我阐述的比较清楚了，你可以根据制度规范和新基线结合既有在册术语，等进行编制，为智能体通道构建提供制度理论的支持。未决事项，按转正四步走"
  - "主体与执行体要分清楚，执行体经主体授权在续存期内是可以连续运行的。从资产的角度上讲智能体作为资产被使用的是其运行功能，价值体现在运行效用，其他版权资产被使用的是置换功能，其价值体现在交易效用"
term_norm_ruling: 交易效用与交换效用同指一物 —— 一律用「交换效用」，不得两词并用（创始人逐字裁定）
