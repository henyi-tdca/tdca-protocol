# ── 口径一：可采信 ＝ 可验证 ＋ 不可篡改（第 17 条）
admissibility:
  article: 17
  definition: '法律可采信之证据 ＝ 可被验证 且 不可被篡改'
  evidence_rule:
    verifiable: true
    immutable: true
  carriers_in_register:
    tamper_anchors:
      - '哈希锚定（可验证）'
      - '权威治理（签批 · 不可随意更）'
      - '外部锚（外部存证）'
      - '行为一致性（篡改致行为偏离 · 可检测）'
    chain: 'NCA 链（哈希链 ＋ 无存证不执行）'
  judge: 'self'                    # 判者 ＝ 我方单方判定
  nature: '在册既有表述之援引；⛔ 不构成本侧法律意见'
  overrides: 'N-22 判准已定；⛔ 退出待点定/待签批；⛔ 不另出解释文件（日后需细化另案）'

# ── 口径二：可信信息自带于锚数据本身（第 18 条）
credible_info_selfproof:
  article: 18
  principle: '数据自带其信息数据；可信与否由该锚数据自身携带之信息是否可验证、不可篡改决定'
  external_supplement_threshold: null      # ⛔ 不设外部补料门槛
  self_proving_required: true
  ip_only:
    self_proving: false                    # 仅 IP 不能自证
    reason: '可共享 / 可动态分配 / 可经代理或网络地址转换 ⟹ 可验证与不可篡改皆不成立'
    outcome: 'ALERT（待补）'
    note: '判告警之由 ＝ 不能自证；⛔ 非"材料不够多"'
  tiers_unchanged: true                    # 四档判据不变
  tiers_meaning: '四档之分 ＝ 自证能力强弱之分'
  overrides: 'N-29 清单保留；最低要件判据已定、⛔ 无留白；附表四末行更正为"判据已定"'

# ── 口径三：评审与承认（第 19 条 · 细化第 8 条）
review_and_recognition:
  article: 19
  external_side: '外部可信等级首先由外部机构完成；我侧 ⛔ 不代其定'
  our_side: '我方之处置 ＝ 承认与否（单向判定）'
  review_required: true
  recognition_requires: '我方复核评审'
  reviewer: 'TDCA'                         # 评审主体 ＝ 我方
  review_content: '该锚能否提供「锚定根物理变迁」之可验证且不可篡改之证据'
  no_auto_same_tier: true
  no_batch_inclusion: true
  procedure_detail: '我方内部程序（按制度流程办；默认＋可改）'
  gates:
    gate1: '过根检查并定级 ＝ 评审'
    gate2: '入网另须加载协议'
    interchangeable: false
    order_default: 'gate1 -> gate2'
  overrides: 'N-20 主体已定（我方）；⛔ 退出待签批；仅程序细则归我方'

