        exposure: 'none'
        status: 'ok'
        source: '本机实测（20261023）'
        updated_at: '2026-10-23'
      - runtime: 'php'
        version: '未安装'
        fix_baseline: '以官方公告为准'
        services: []
        exposure: 'none'
        status: 'ok'
        source: '本机实测（20261023）'
        updated_at: '2026-10-23'
      - runtime: 'python'
        version: '3.12.10'
        fix_baseline: '未波及'
        services: ['sandbox-scripts']
        exposure: 'local'
        status: 'ok'
        source: '本机实测（20261023）'
        updated_at: '2026-10-23'
