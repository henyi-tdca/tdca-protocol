# ⚠️ 本件只放骨架与组件映射；节点明细（含地址等）留运维私域，⛔ 入仓
schema_version: '1.0'
ledger_id: 'TDCA-SEC-RUNTIME-LEDGER-001'
updated_at: '2026-10-23'
owner: 'reasonix / L1-SI-167'

# 组件 → 运行时映射（五组）
component_runtime_map:
  - component: 'core-go(enforce/nca/nsfl)'
    runtime: 'go'
    exposure_hint: 'protocol-execution'
  - component: 'tdcad'
    runtime: 'go'
    exposure_hint: 'daemon'
  - component: 'mcp-bridge'
    runtime: 'go'
    exposure_hint: 'network-bridge'
  - component: 'site-backend'
    runtime: 'php'
    exposure_hint: 'public-api'
  - component: 'frontend-build'
    runtime: 'node'
    exposure_hint: 'build-chain'
  - component: 'mailbox/scheduler/sandbox-scripts'
    runtime: 'python'
    exposure_hint: 'internal'

# 判定档
status_values: ['ok', 'below-baseline', 'unknown']

# 节点行（示例与已核者；详表明细留私域）
nodes:
  - node: 'local-workstation'
    note: '本侧开发工作站（非 CI、非站点）'
    runtimes:
      - runtime: 'node'
        version: 'v24.18.1'
        fix_baseline: '24.22.1'
        services: ['frontend-build']
        exposure: 'local'
        status: 'below-baseline'
        source: '本机实测（20261023）'
        updated_at: '2026-10-23'
      - runtime: 'go'
        version: '未安装'
        fix_baseline: '以官方公告为准'
