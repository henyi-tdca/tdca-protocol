layers:
  - {level: 1, name: 内部产物, note: 制度构建与工程化全过程见证, root: TDCA-STATEMENT-NCA-ASSET-001}
  - {level: 2, name: 可信认知资产, note: 可信＝可验证（链＋哈希＋签批位）；认知＝T-030 第五阶, root: TDCA-AMEND-STATEMENT-NCA-ASSET-001-001}
  - {level: 3, name: 数据资产, note: 落在 IP 版权资产涵盖门类内（内容／数据／商标／专利），⛔ 新立门类, root: SPEC-IPASSESS-002 第二条}
