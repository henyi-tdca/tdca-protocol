title_zh: NCA 索引层字段骨架规范（三态标注·资产类与运行类分栏·LC-1至LC-4·段位分列）
version: V0.1
status: DRAFT-INTERNAL
date: '2026-10-22'
session: L1-SI-164
authored_by: Reasonix
upstream:
  - TDCA-PLAN-NCA-COS-001   # 期一 A-2 包
  - TDCA-NCA-STD-001-V1.1   # 十三字段与类型枚举之制度源
  - TDCA-AMEND-STATEMENT-NCA-ASSET-001-002  # 链级定性 LC-1~LC-4
  - TDCA-AMEND-STATEMENT-NCA-ASSET-001-001  # 可信认知资产／数据资产归属
basis_measured:
  registry_records: 5627
  linked_segment_from: 'GSEQ-2936'
  linked_segment_count: 2693
  legacy_segment_count: 2934
  probe_file: '.tdca-nca/reports/_NCA-A2-PROBE-20261022.json'

# ── 三态定义（缺一不可，⛔ 混称）
states:
  DIRECT:
    zh: 直取
    rule: 件内已有字段，脚本可直接读数
  DERIVED:
    zh: 派生
    rule: 由既有字段或件体复算可得，且复算可被他人独立重现
  PENDING:
    zh: 待建
    rule: 在册无载体；本规范只定义字段与口径，⛔ 填 0、⛔ 填空串、⛔ 估充、⛔ 以日志代填

# ── 段位（祖父条款：⛔ 不回改历史件，只影响可得性统计口径）
segments:
  SEG-LINKED:
    zh: 带链段
    range: 'GSEQ-2936 起'
    count_measured: 2693
    policy: 照 STD-001 V1.1 十三字段全量要求
  SEG-LEGACY:
    zh: 未链历史段
    range: 'GSEQ-2936 之前'
    count_measured: 2934
    policy: 祖父条款·⛔ 不回改；字段缺项一律标 PENDING-LEGACY，⛔ 判不合规

# ── 分栏（资产类 / 运行类 · ⛔ 混表）
columns:
  asset:
    zh: 资产类
    meaning: 认知资产属性（场景·认知·对齐·依据·资产归属）
    source_rule: 只取 NCA 件与台账，⛔ 取运行日志
  ops:
    zh: 运行类
    meaning: 执行与技术属性（时间·工具·哈希·链·环境）
    source_rule: 亦可取件与台账；环境类无载体者标 PENDING

# ── 同词异指之辨明（⛔ 混用）
disambiguation:
  chain_verify_L:
    symbol: 'L-1／L-2／L-3'
    owner: '_nca_chain_verify_v1.py'
    meaning: 链完整性（chain_id 一致／prev_nca 接续／self_sha256_16 相符）
  cognitive_L:
    symbol: 'LC-1／LC-2／LC-3／LC-4'
    owner: 本规范
    meaning: 链级认知判据（场景锚定／两方认知／判性可判／依据落制度件）
  rule: ⛔ 两套不得互代；本规范一律写 LC- 前缀

fields:
  # ── 层 A：台账层（REG）
  - {id: A01, name: reg.gseq, layer: reg, column: ops, state: DIRECT, source: 'NCA-REGISTRY.records[].gseq', method: '直读', measured: '5627/5627'}
  - {id: A02, name: reg.nca_id, layer: reg, column: ops, state: DIRECT, source: 'records[].nca_id', method: '直读', measured: '5627/5627'}
  - {id: A03, name: reg.timestamp, layer: reg, column: ops, state: DIRECT, source: 'records[].timestamp', method: '直读', measured: '5627/5627'}
  - {id: A04, name: reg.fc_id, layer: reg, column: ops, state: DIRECT, source: 'records[].fc_id', method: '直读', measured: '5627/5627'}
  - {id: A05, name: reg.operation_type, layer: reg, column: ops, state: DIRECT, source: 'records[].operation_type', method: '直读', measured: '5627/5627'}
  - {id: A06, name: reg.operator, layer: reg, column: ops, state: DIRECT, source: 'records[].operator', method: '直读', measured: '5627/5627'}
  - {id: A07, name: reg.source, layer: reg, column: ops, state: DIRECT, source: 'records[].source', method: '直读', measured: '5627/5627'}
  - {id: A08, name: reg.status, layer: reg, column: ops, state: DIRECT, source: 'records[].status', method: '直读', measured: '5626/5627'}
  - {id: A09, name: reg.files, layer: reg, column: ops, state: DIRECT, source: 'records[].files', method: '直读', measured: '5615/5627'}
  - {id: A10, name: reg.chain_id, layer: reg, column: ops, state: DERIVED, source: 'records[].chain_id', method: '缺者取 records[].gseq', measured: '2693/5627 直存', legacy: PENDING-LEGACY}
  - {id: A11, name: reg.prev_nca, layer: reg, column: ops, state: DERIVED, source: 'records[].prev_nca', method: '缺者取上一条带链 record 之 nca_id，链首 GENESIS', measured: '2693/5627 直存', legacy: PENDING-LEGACY}
  - {id: A12, name: reg.self_sha256_16, layer: reg, column: ops, state: DERIVED, source: 'records[].self_sha256_16', method: '缺者按所指件实测 sha256 前 16 位', measured: '2693/5627 直存', legacy: PENDING-LEGACY}
  # ── 层 B：件层（DOC · 照 STD-001 V1.1 十三字段）
  - {id: B01, name: doc.nca_id, layer: doc, column: ops, state: DIRECT, source: 'NCA 件首部', measured: '2724/5627'}
  - {id: B02, name: doc.side, layer: doc, column: ops, state: DIRECT, source: 'side', measured: '2693/5627', legacy: PENDING-LEGACY}
  - {id: B03, name: doc.timestamp, layer: doc, column: ops, state: DIRECT, source: 'timestamp', measured: '2723/5627'}
  - {id: B04, name: doc.chain_space, layer: doc, column: ops, state: DERIVED, source: 'chain_space', method: '照 STD 取值矩阵：RX=gseq／KW=kimi／WB=ref-gseq', measured: '2693/5627'}
  - {id: B05, name: doc.chain_id, layer: doc, column: ops, state: DIRECT, source: 'chain_id', measured: '2693/5627'}
  - {id: B06, name: doc.chain_ref, layer: doc, column: ops, state: DIRECT, source: 'chain_ref', measured: '2693/5627', note: '空属正常（非跨侧件）'}
  - {id: B07, name: doc.prev_nca, layer: doc, column: ops, state: DIRECT, source: 'prev_nca', measured: '2721/5627'}
  - {id: B08, name: doc.operation_type, layer: doc, column: ops, state: DIRECT, source: 'operation_type', measured: '2693/5627'}
  - {id: B09, name: doc.actor, layer: doc, column: ops, state: DIRECT, source: 'actor', measured: '2723/5627'}
  - {id: B10, name: doc.artifacts, layer: doc, column: ops, state: DIRECT, source: 'artifacts[].path／sha256_16', measured: '2693/5627'}
