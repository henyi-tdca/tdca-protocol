  - {id: B13, name: doc.compliance, layer: doc, column: asset, state: DIRECT, source: 'compliance（挂载六条）', measured: '2695/5627'}
  # ── 层 C：链级认知判据（LC · 本规范改名避与链验器 L- 同名）
  - {id: C01, name: lc1.scene_anchor, layer: lc, column: asset, state: DERIVED, source: 'scope＋scene_boundary_ref', method: '一级：scope 非空；二级：scope 内场景指针或场景件号（正则）', measured_proxy: '343/5627 场景词命中', pending_part: 'scene_boundary_ref 字段无载体 ⟹ 二级只作近似，⛔ 以近似判判据成立'}
  - {id: C02, name: lc2.two_party, layer: lc, column: asset, state: DERIVED, source: 'actor＋operation_type＋邻接', method: '同场景存在「提交件（Delivery／HandoffDeliverable／Document）＋核证件（Witness／SignOff／Ruling／SessionClose）」成对', measured_proxy: '以 operation_type 与 scope 引件号近似', note: '单方自记不构成对齐'}
