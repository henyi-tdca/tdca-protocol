  - {id: E01, name: op.runtime_env, layer: ops, column: ops, state: PENDING, source: '运行环境', note: '⛔ 从生产日志取；非本表口径'}
  - {id: E02, name: op.container_id, layer: ops, column: ops, state: PENDING, source: '容器标识', note: '同上'}
  - {id: E03, name: op.duration_ms, layer: ops, column: ops, state: PENDING, source: '耗时', note: '同上；⛔ 日志口径统计资产'}
  - {id: E04, name: op.column_guard, layer: ops, column: ops, state: DERIVED, source: '本表自检', method: "asset 栏字段不得取日志；ops 栏字段不得混资产口径", note: '分栏断言位'}

backfill:
  script: '.tdca-nca/scripts/_nca_index_backfill_v1.py'
  output: '.tdca-nca/reports/_NCA-INDEX-BACKFILL-20261022.jsonl'
  rules:
    - 逐条一行；三态分列；PENDING 写 null 并在 state 注记
    - 段位分列（SEG-LINKED／SEG-LEGACY）
    - ⛔ 填 0 冒充、⛔ 空串冒充、⛔ 估充、⛔ 日志代填
    - 派生值一律按当刻台账与件体重算，⛔ 抄旧报告

acceptance:
  M2_target: 对主账当刻 records 全量出字段可得性台账，两栏与两段位分列，PENDING 数如实
  gate:
    - 直取字段计数＝脚本实读计数
    - 派生字段可被第三方按 method 复现
    - PENDING 字段计数与 schema 声明一致

non_goals:
  - 不回改任何历史 NCA 与台账行
  - 不代定认知距离权重与阈值
  - 不以本 schema 变更 STD-001 V1.1 十三字段语义
  - 不对外

revision:
  mode: append-only
  conflict_rule: 人读版为准
