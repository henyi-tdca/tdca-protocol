  - {id: C04, name: lc4.basis_cited, layer: lc, column: asset, state: DERIVED, source: 'scope', method: 'scope 内匹配在册件号／口径号（正则 GSEQ-／TDCA-／T-###／ID##）', measured_proxy: '1427/5627 依据命中'}
  # ── 层 D：资产属性（AS · 在册口径已定、件内无载体）
  - {id: D01, name: as.asset_class, layer: asset, column: asset, state: PENDING, source: '在册定性（数据资产／T-030 第五阶）', note: '口径在册、字段未建；⛔ 以口径代填'}
