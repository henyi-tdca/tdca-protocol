  - {id: D04, name: as.alignment_threshold_hit, layer: asset, column: asset, state: PENDING, source: '协商阈值 0.35（在册）', note: '依赖 D03'}
  - {id: D05, name: as.succession_ref, layer: asset, column: asset, state: PENDING, source: '继承线', note: '继承线未启'}
