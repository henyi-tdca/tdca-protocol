dimensions:
  - id: D31
    name: 六要素字段完整率
    threshold: 绿 ≥99%／黄 95–99%／红 <95%
    over_action: 红即入 §4 置顶 ＋ 出补录交办
    owner: 生成器（判定）／人工裁决（§4）
  - id: D32
    name: 熔断事件与处置
    threshold: 超时未恢复 >0 即入 §4
    over_action: 未恢复清单直通 §4
    owner: 生成器／人工裁决
  - id: D33
    name: 正和验证
    threshold: 负和拦截未处置 >0 即红
    over_action: 未评估调用单列 ＋ 入 §4
    owner: 生成器／人工裁决
  - id: D34
    name: MOU 锚定覆盖
    threshold: 覆盖率下降 >θ（两机制分列；MOU-001 归零与 T-036-L3 熔断各判）
    over_action: 黑洞清单单列不并入总率
    owner: 生成器／人工裁决
  - id: D35
    name: 化合链健康
    threshold: 孤儿资产数上升即黄；未经锚定调用即红
    over_action: 孤儿清单 ＋ 反向析构台账
    owner: 生成器／人工裁决
  - id: D36
    name: 场景边界合规
    threshold: 未经声明即行动记录应为 0；非 0 即重大异常
    over_action: 直通 §4 置顶
    owner: 生成器／人工裁决
  - id: D37
    name: 资产性质与来源
    threshold: 无 NCA 依据之资产读数为 0 才合规
    over_action: 无依据项单列 ＋ 不入资产口径
    owner: 生成器／制度管理方（口径）
    new_in: V1.0
    source_rule: 只取 NCA 件与台账；⛔ 从生产日志取
    exclude:
      - 无场景锚定之件（裸事实）⟹ 留日志层
      - 运行类读数（耗时／环境／容器）⟹ 在册禁令
  - id: D38
    name: 认知对齐维
    threshold: 协商阈值 0.35（在册）；d 之漂移阈值待定（⛔ 本侧不擅补）
    over_action: 漂移场景单列 ＋ 入 §4
    owner: 生成器／人工裁决
    new_in: V1.0
    metrics: [LC-1 场景锚定成立件数, LC-2 两方认知成对件数, LC-3 判性可判件数, LC-4 依据落制度件件数, d 下降场景数, d 上升场景数, 触及 0.35 之对数, 待建项计数]
    data_source: _NCA-INDEX-BACKFILL-*.jsonl（索引层回填器）
    recalculation_base: 当刻台账（⛔ 沿用旧值）
    limits:
      - 以近似法计，⛔ 表述为判据已全部成立
      - d 之计算须用 DCD-COG-ALIGN-001 引擎，⛔ 自造算法与权重
    naming_rule: 一律写 LC- 前缀；⛔ 与链验器 L-1~L-3（链完整性）混用

