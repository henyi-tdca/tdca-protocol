clauses:
  - {id: 1, topic: 定位, key: NCA 制度是 TDCA 基础制度之一（类名基本制度）；本件为统合草案}
  - {id: 2, topic: 与在册关系, key: ⛔ 替代 STD-001 V1.1；在其上补四事}
  - {id: 3, topic: 适用范围, key: 三侧今后新登记；既有 NCA 一律不变不动（祖父条款）}
  - {id: 4, topic: 定性四层, key: 内部产物→可信认知资产（可验证）→数据资产（T-030 第五阶）→过程认知链}
  - {id: 5, topic: 三处不同, key: 产生于协作关系／内容是判断／价值随链增长}
  - {id: 6, topic: 三空间, key: NS 负空间审查区／SBX 沙盒验证区／PCM 协议配置市场（照 DSA-001）}
  - {id: 7, topic: 衔接四条, key: 空间标识随件／链不断／跨空间引用走 chain_ref／判据分段链不分段}
  - {id: 8, topic: 可溯源可审计, key: 接口成对件／沿链回链首可验／判据有落件且审计者入链}
  - {id: 9, topic: 类型三元, key: stage_space × flow_stage × action_type}
  - {id: 10, topic: 类型门禁, key: 三元缺一即类型不完整；同号同动作异空间或异环节即不同类型}
  - {id: 11, topic: 展示形态, key: 建议 SBX·F7·HandoffDeliverable；nca_id 形态不变}
  - {id: 12, topic: 索引层, key: 40 字段三态（DIRECT／DERIVED／PENDING）；PENDING 写 null 不写 0}
  - {id: 13, topic: 两栏与段位, key: 资产类与运行类不混；带链段与未链历史段分列（祖父条款）}
  - {id: 14, topic: 两元待建, key: stage_space 与 flow_stage 台账未建；⛔ 声称已按三元登记}
  - {id: 15, topic: 动态量归属, key: 沙盒四类动态量⛔ 记在台账，读数在引擎}
  - {id: 16, topic: 出盒后定性, key: 出沙盒后 NCA 即执行的确定性过程之 NCA（可重放、不再实时计算）}
  - {id: 17, topic: 待建与不同源, key: 真有字段位未建＝PENDING；他层过程量＝OUT-OF-LEDGER；⛔ 互换、⛔ 写 0}
  - {id: 18, topic: 与生产日志七条区分, key: 触发／地位／要件／内容／豁免／可重建／价值形态}
  - {id: 19, topic: 两条禁令, key: ⛔ 日志口径统计资产；⛔ 灌自动化事件凑量}
  - {id: 20, topic: 审计八维, key: 3.1 完整率／3.2 熔断／3.3 正和／3.4 锚定／3.5 化合／3.6 边界／3.7 资产来源／3.8 认知对齐}
  - {id: 21, topic: 数据源二分, key: 台账可算四维 DERIVED；沙盒四维 OUT-OF-LEDGER（须从引擎取数）}
  - {id: 22, topic: 审计铁律, key: DERIVED 必带算法注；PENDING 写待建；⛔ 替代台账权威；审计者入链}
  - {id: 23, topic: 跨侧三件必登, key: ProtocolInit／Delivery／SessionClose 为每框下限；四必登时点为全量；取并集}
  - {id: 24, topic: 落账, key: 记录落主账、件体留侧库；侧出件本侧核证后代录；不迁件不追溯不合并链号}

