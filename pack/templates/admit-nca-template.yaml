# TDCA 五元协作开源社区 · 准入 NCA 模板（L1 缔约者）[SIMULATED]
# 模板编号: TDCA-ADMIT-TEMPLATE-001 ｜ 状态: FROZEN 候选（DCD-OPC-COMMUNITY-001 签批）
# 制度锚定: TDCA-OPC-COMMUNITY-001 + TDCA-CONST + NSFL-V0.2
# ID92: 本准入不构成真实配置权执行路径；缔约权利为荣誉凭证，无金钱承诺、不可转让、不可交易
# 用法: 运行 tools/enforce_entry.py --new 自动生成本模板的填充草稿（推荐），或手工复制后替换 {占位符}
NCA-ID: TDCA-ADMIT-{YYYYMMDD}-{SEQ:03d}   # 序号由 enforce_entry.py 按 nca-archives/ 当日最大序号 +1 生成
Operation-Type: AdmissionNCA              # 固定值
Operator: {缔约者 GitHub ID}               # 签名主体，与 Contractor.GitHub-ID 一致
Timestamp: '{UTC ISO8601}'
Scope: 加入 TDCA 五元协作开源社区，成为 L1 缔约者；接受基协议声明；认领任务与参与讨论的权利登记
Contractor:
  GitHub-ID: {GitHub 用户名}
  Legal-Name: ''                          # 可选；留空则仅以 GitHub ID 缔约
  Contact: ''                             # 可选：email / 其他异步通道
  Jurisdiction: 中国境内                   # 可选：声明适用法域，默认中国境内
  Joined-At: '{UTC ISO8601}'
Base-Protocol-Acceptance:                 # 四项基协议全列 + Accepted: true（enforce_entry R5 校验）
  TDCA-CONST: true            # 宪法：主权信用三锚（e-CNY 唯一结算 / 税收效用锚 / 版权链·天平链权利锚）
  NSFL-V0.2: true             # 负空间函数语言：不发币、不公售、不承诺分红、不以积分/凭证变相交易
  TDCA-WORKING-SPEC-001: true # 开发工作规范：六要素 / NCA 存证 / 数据性质标注
  TDCA-OPC-COMMUNITY-001: true # 社区方案：缔约者网络而非用户群
  Accepted: true
Red-Lines-Acknowledged:                   # 合规红线（R6：非空且含负空间条款；R10：禁词熔断扫描）
  - 不发币、不公售、不承诺分红、不代币化（NSFL 负空间一票否决）
  - 社区内容涉真实资金/真实税务数据前保持 simulated 标注（ID92）
  - 不拉踩其他协议（MCP/A2A/x402 一律正交/挂载表述）
  - 贡献确权（节点 NCA）为荣誉凭证，无交易属性与收益预期
  - 真实态结算只走 e-CNY 法币轨道，不接稳定币
Provenance:
  Status: Simulated                       # 固定值（R7：准入阶段无真实配置权）
  Note: 准入自声明；GitHub ID 与提交行为可由仓库 git log 核验；其余字段不可核验部分以自声明为准
Commit-Ref: ''                            # 可选：首次贡献/认领 PR 的 commit sha（认领时补填）
Human-Signature:                          # 缔约者自签署（R8：Signed-By 必须等于 GitHub-ID，不可代签）
  Status: Signed
  Signed-By: {缔约者 GitHub ID}
  Signed-At: '{UTC ISO8601}'
Negative-Space-Check:
  NSFL-Version: V0.2
  Triggered: false
  Trigger-Reason: null
  Checked-By: enforce_entry.py（准入自检）
