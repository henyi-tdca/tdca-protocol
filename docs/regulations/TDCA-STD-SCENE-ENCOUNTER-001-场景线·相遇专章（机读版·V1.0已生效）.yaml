chapters:
- id: ch1
  title: 总则
  articles:
  - 'no': 1
    title: 目的
    text: 为把「相遇」落地为可判的接口，使缔约前的主体匹配有据可依、可查、可追索。
  - 'no': 2
    title: 依据
    text: 本专章依制度转正程序拟定，其研究、评估、断言与沙盒记录在册可溯。
  - 'no': 3
    title: 适用范围
    text: 适用于场景线内的主体匹配（相遇）。不适用于撮合服务（撮合另属一条线）。
  - 'no': 4
    title: 定义
    text: 相遇：在信息与制度公开之下自然发生的双向奔赴匹配事件——免费，双方自愿互赴。撮合：主动提供的匹配服务——收费，另属一条线。相遇是场景内「交互」的第一环（不是「场景周期的第一环」）。
- id: ch2
  title: 相遇与撮合的划界
  articles:
  - 'no': 5
    title: 并列不互推
    text: 相遇与撮合并非同一件事；不得互为指代——不得以「相遇」称呼「撮合」，反之亦然。
  - 'no': 6
    title: 收费边界
    text: 撮合服务费照收。相遇本身不收费——不得设「相遇入口费」「相遇流量计价」「相遇曝光计费」。
  - 'no': 7
    title: 场景为先
    text: 相遇必有场景（场景即其定义域）；无场景的相遇不成立。为特定的相遇，可以构建相应的场景。
    legislative_note: 本条的立法意图：防止把「相遇」做成无场所、无边界、可被任意解释的概念。
- id: ch3
  title: 相遇「是否发生」的存证
  articles:
  - 'no': 8
    title: 二分
    text: 相遇的存证状态只有两种：发生或未发生。不设「真假相遇」这类判定——因为相遇是双向奔赴，只有「发生没发生」。
  - 'no': 9
    title: 未发生之记法
    text: 未发生的，如实记「未发生」；不加罚则，不计信用后果。
  - 'no': 10
    title: 存证口径
    text: 相遇（含未发生）同链存证，格式与在册存证口径一致。
    legislative_note: 本条的立法意图：防止把「没成交」记成「当事人有问题」。
- id: ch4
  title: 相遇流程与状态机
  articles:
  - 'no': 11
    title: 三态
    text: 相遇流程分三阶段：发现 → 相遇 → 握手；其后续接「交互 → 结算」，属既有的交互与缔约链路。
  - 'no': 12
    title: 迁移与回退
    text: 合法迁移限于规定集合，且允许回退：相遇不成则回到「发现」，握手失败则回到「相遇」。其余迁移一律拒绝。
  - 'no': 13
    title: 禁则
    text: 未握手不得调用配置权。此项由既有的越级阻断规则承接，不另立新规；门禁面沿用既有条目，不新增。
  - 'no': 14
    title: 发现阶段之限
    text: 发现阶段的产出只是线索；不得以「可见性」或「引用分」作为相遇成立的依据。
    legislative_note: 本条的立法意图：防止把「被看到」当成「被认可」。
- id: ch5
  title: 附则
  articles:
  - 'no': 15
    title: 双版本
    text: 本专章配有机读版；人读版为语义权威，机读版不得反向改语义。
  - 'no': 16
    title: 术语
    text: 「相遇」作为场景线的表述用语，不另立独立术语。
  - 'no': 17
    title: 生效
    text: 本专章经签署后生效；生效日为 2026-10-06。
