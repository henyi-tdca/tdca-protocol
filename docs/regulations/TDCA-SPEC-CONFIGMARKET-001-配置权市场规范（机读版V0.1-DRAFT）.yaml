# ⚠️ 未生效：须四步程序全过 + 授权方签批
spec_id: TDCA-SPEC-CONFIGMARKET-001
version: V0.1-DRAFT
status: DRAFT            # ⚠️ 未生效：须四步程序全过 + 授权方签批
effective_from: null     # 签批后回填
