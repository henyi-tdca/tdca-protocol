draft_source: A 类主件《TDCA 协议配置网络市场管理规范及用户须知》V1.0（2026-06-11 · 桌面归档「制度合规与安全治理」）  # 以 A 类主件为底稿重写
authority:
  human_readable_zh: TDCA-SPEC-CONFIGMARKET-001-配置权市场规范（单一权威稿·中文人读版V0.1-DRAFT）.md
  human_readable_en: TDCA-SPEC-CONFIGMARKET-001-配置权市场规范（英文人读版V0.1-DRAFT）.md
