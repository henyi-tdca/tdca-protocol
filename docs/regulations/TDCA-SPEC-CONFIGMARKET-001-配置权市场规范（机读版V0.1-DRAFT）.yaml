  zh: present
  en: present            # 本批补出（英文人读版）
  machine: present

# 一、总则
chapter1_general:
  - id: A1
    title: 目的
    text: 定 L2 配置权市场之准入、登记、授权、公开、交易、结算、争议与退出（承旧总规范「总则 + 三章」体例）
  - id: A2
    title: 适用范围
    text: 适用于本站点内部运行（期一 · 内部真跑）
    note: 对外上线另须授权方明示（归公示面之生效与撤回）
  - id: A3
    title: 两条根本口径
    items:
      - key: 不依赖外部
        text: 凡有外部依赖之动作，现行一律采自足形态运行（确权＝登记；签署＝法律主体本人；结算＝SIMULATED）
      - key: 平移位预留
        text: 外部接通后按位平移
        note: 见 chapter7 · 不改要件与效力层级
  - id: A4
    title: 四项基本原则
    items:
      - 正和效用（协作须正和）
      - 税收锚定（效用锚定税收；不锚定价格利润）
      - 负空间零容忍
      - 可审计可追溯（无存证不执行）
    change_note: 旧总规范「四方联签原则」不入本条 ⟹ 改为法律主体签名 + 协商条件双方一致签批（自足形态）；「四方联签」列平移位（见 chapter7 第 2 项）

# 二、权属登记（一期段 · 场景约束下）
chapter2_ownership_registration:
  - id: A5
    title: 入口
    text: 凡具表达形式者皆可登记（承旧件之开放入口）
  - id: A6
    title: 法域四支
    map:
      表达形式: 著作权
      发明: 专利法
      数字结构化: 数据法
      标识: 商标法
  - id: A7
    title: 要件
    items: [归属场景, 生成来源谱系]
    note: 权属登记不以场景为必须（场景非必须 · 仅认表达形式）；授权登记则场景必须（见 A11）
  - id: A8
    title: 边界
    text: 一期只做登记／变更／注销／查询；转让／许可（权利处分）不在一期
  - id: A9
    title: 确权方式（自足）
    text: 确权以登记制自足运行；确权登记为 L2 授权之前置
    migration: 外部确权机构接通 ⟹ 确权动作改由外部承接（不改登记要件）

# 三、授权登记与授权件
chapter3_authorization:
  - id: A10
    title: 二分
    text: 权属登记（归谁）／授权登记（谁能怎么用）；两者各自成件（缺一不可互为前提）
  - id: A11
    title: 四要件
    items: [场景约束_必须, 五阶资产形态, 全构成已授权, 法律主体签名]
  - id: A12
    title: 签署形式
    forms: [电子签名, 授权码]
    note: 二者皆须本人出示；智能体不代持、不代填、不代签；形式类型落 NCA；不改四要件
  - id: A13
    title: 解释项即授权件
    text: 解释项 ＝ 授权登记件；无授权不得调用；无授权而配置 ＝ 侵权
    exception: 例外仅沙盒演练；出盒须授权
  - id: A14
    title: 自有亦须件
    text: 自有亦须授权件（不因权属在己而免）
  - id: A15
    title: 多层级
    text: 多层级授权逐层皆须件、逐层皆须签
    pending: 层数上限待授权方定
  - id: A16
    title: 操作层
    operations: [预收权, 实时授权, 追加授权, 许可变更, 多层级授权]
    styles: [规范式, 自定义式]
    authority: TDCA-DESIGN-AUTH-PANEL-001（在册设计件）

# 四、公开与公示
chapter4_publicity:
  - id: A17
    title: 公开面
    text: 权属件与授权件全网可查
    public_fields: [权属信息, 授权信息, 授权状态, 获取方式]
    note: 「获取方式」不等于已获授权
  - id: A18
    title: 条件公开
    text: 初始条件必须公开（否则无法计算可否配置）；协商条件其公开须双方一致签批；公开不得收回；协商粒度自定义
  - id: A19
    title: 不公开四条
    items: [内部编号, 凭据与密钥, 自然人敏感信息, 负空间词面]
  - id: A20
    title: 要约配置网络
    flow: [授权方要约_单方定初始条件_必公开, 需求方要约_单方定需求初始条件_必公开, 磋商_双向_协商条件公开须双方一致签批, 达成_生成授权件_四要件齐, 多对多网络]

# 五、市场运行（承旧总规范「第一章」六条 · 逐条对齐）
chapter5_market_ops:
  - n: 1
    item: 市场准入
    text: 准入以缔约 + 权属／授权登记为前提（承旧件「主体四端准入」之义）
    note: 四端分类名以在册术语为准
    pending: 准入门槛取值
  - n: 2
    item: 交易规则
    text: 交易限于配置权（所有权不流转）；撮合双轨（承旧件）
    pending: 撮合细则
  - n: 3
    item: 定价与估值
    text: 定价以正和效用与税收锚定为锚（不锚定价格利润）；费用照录旧件并标待核
    pending: 费率归授权方
  - n: 4
    item: 结算与分配
    text: 结算 SIMULATED 沙盒态（期一）；分配依在册（Shapley 口径依在册件 · 本侧不代定算法）
    pending: 参数取值
  - n: 5
    item: 信息披露
    text: 承 chapter4（公开面 + 四字段 + 不公开四条）
    pending: null
  - n: 6
    item: 争议与退出
    text: 争议 TDCA 只调和（记录／存证／登记；不审判、不处置、不代追偿）；责任实体归执法机构；退出与清退承旧件
    pending: 「裁决」措辞取舍（归授权方）

# 六、与在册制度之衔接
chapter6_interfaces:
  - id: 1
    instrument: TDCA-STD-SRIGHT-001
    point: 本稿定制度面；调用实现面以该件为准（人读版为语义权威 · 机读不得反向改语义）
  - id: 2
    instrument: TDCA-RULING-CONFIGRIGHT-TERM-001（+AMEND-1/2）
    point: 配置权用语用「场景可以用函数来作形式化表达」；效力路径用「各管其面」
  - id: 3
    instrument: TDCA-STD-METAFUNC-ACCORD-001（REV2）
    point: 关系面（元函数 ⟷ 解释项）以该件为准；角色＝调和；条件缔约时约定（不得事后单方追加）
  - id: 4
    instrument: TDCA-TERM-REGISTER-SCENE-PERSIST-001
    point: 最小配置单元 ＝ 场景（内部要素不直接参与配置）
  - id: 5
    instrument: TDCA-RULING-POSITIVESUM-DISCRIMINATION-001（+AMEND-1）
    point: 正和歧视 ＝ 辨别力；处置调配置权重、调在场
  - id: 6
    instrument: 在册 MOU 本体论口径 + TDCA-RULING-PHASE1-BUILD-PROPOSAL-001（五阶）
    point: 锚定 ＝ 地板非天花板；五阶表述照在册
  - id: 7
    instrument: TDCA-REGISTER-CONTRACT-001（缔约三件套）
    point: 准入之根；人类签名权（智能体不代行）

# 七、外部依赖与平移位（六项）
chapter7_external_migration:
  - id: 1
    external: 外部确权机构（法定交易中心）
    current_self_sufficient: 登记制
    migration_slot: 确权动作外移
    condition: 外部接通（时点归授权方）
  - id: 2
    external: 四方代表联签
    current_self_sufficient: 法律主体签名 + 双方一致签批
    migration_slot: 增联签轨（并行 · 不替代）
    condition: 外部代表实体接通
  - id: 3
    external: 真实数字人民币账本
    current_self_sufficient: SIMULATED 沙盒
    migration_slot: 接真实通道
    condition: 通道与合规齐备
  - id: 4
    external: 节点物理锚定
    current_self_sufficient: 载体就绪度纪律（就绪无 transport 不得冒充已执行）
    migration_slot: 实物锚定实测
    condition: 实物与测试环境接通
  - id: 5
    external: 司法／执法处置
    current_self_sufficient: 只调和（记录／存证／登记）
    migration_slot: 无需平移（在册即如此）
    condition: 接口留痕
  - id: 6
    external: 市场调用协议与调度税
    current_self_sufficient: 接口层 DRAFT
    migration_slot: 接口层升格
    condition: 待签批

