  id: TDCA-CONSTITUTION
  title_zh: TDCA 可信协作宪法
  title_en: TDCA Trusted Collaboration Constitution
  version: V0.1
  date: '2026-10-18'
  status: draft_candidate
  external_granted: true
  publication_state: published
  authority_language: zh
