  precond: 已知双方策略空间 {合作, 背叛} 及四类收益 (T 背叛诱惑/R 互合作/P 互背叛/S 被卖)
  postcond: '个体理性导致集体非理性; 破解之道在重复博弈与可信承诺；⟂解释项《机制设计 (Mechanism Design)》(核心: 给定期望社会目标, 设计规则/制度使自利理性人在均衡下的行为恰好实现该目标(激励相容); 是博弈论的反向工程 —— 不分析给定博弈, 而设计博弈本身)：排序 T>R>P>S 不是宿命而是设计变量: 机制设计将''给定矩阵下必败的背叛占优''逆向重构为''重设计制度使合作成为占优''——通过
