  negative_space: ⊗ 收益不可量化或排序不严谨 (T>R>P>S 不成立) 则矩阵失真；⊗ 目标不可量化/参与人异质偏好未建模则机制无从设计
  steps:
  - 列出双方策略空间 {合作, 背叛}
  - 标定 T/R/P/S 四类收益
  - 校验 T>R>P>S 排序 ⟂【机制设计 (Mechanism Design)】列出参与人与其私有信息(类型空间) → 定义社会目标(效率/公平/收入) → 形式化为社会选择函数 f
