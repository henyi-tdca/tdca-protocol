primitives:
- name: pd_payoff_build
  method: 囚徒困境 (Prisoner's Dilemma) (经 机制设计 (Mechanism Design) 解释)
  signature: fn pd_payoff_build(T, R, P, S) -> payoff_matrix
  precond: 已知双方策略空间 {合作, 背叛} 及四类收益 (T 背叛诱惑/R 互合作/P 互背叛/S 被卖)
  postcond: '个体理性导致集体非理性; 破解之道在重复博弈与可信承诺；⟂解释项《机制设计 (Mechanism Design)》(核心: 给定期望社会目标,
    设计规则/制度使自利理性人在均衡下的行为恰好实现该目标(激励相容); 是博弈论的反向工程 —— 不分析给定博弈, 而设计博弈本身)：排序 T>R>P>S 不是宿命而是设计变量:
    机制设计将''给定矩阵下必败的背叛占优''逆向重构为''重设计制度使合作成为占优''——通过 VCG/Clarke 税式转移支付内化背叛的外部性, 或引入重复博弈可信承诺,
    使 (合作,合作) 在新机制下成为激励相容的占优均衡; 你不再在给定博弈中求生, 而是重构博弈使均衡跳变到社会最优 (这正是机制设计=反向博弈论的核心: 设计规则让自利理性恰好产出期望目标)
    (目标达成)'
  negative_space: ⊗ 收益不可量化或排序不严谨 (T>R>P>S 不成立) 则矩阵失真；⊗ 目标不可量化/参与人异质偏好未建模则机制无从设计
  steps:
  - 列出双方策略空间 {合作, 背叛}
  - 标定 T/R/P/S 四类收益
  - 校验 T>R>P>S 排序 ⟂【机制设计 (Mechanism Design)】列出参与人与其私有信息(类型空间) → 定义社会目标(效率/公平/收入) →
    形式化为社会选择函数 f
  nca_emit: true
dispatch:
  main_pipeline: pd_payoff_build
  graph:
  - from: pd_payoff_build
    to:
    - social_choice_target
    bind: 校验 T>R>P>S 排序
    note: pd_payoff_build 在 [校验 T>R>P>S 排序] 嵌套调用 social_choice_target (解释项机制)
  note: 父计主原语在绑定步嵌套调用解释项主原语, 组合语义涌现 (跨范式)
decision:
- if: 需构建收益矩阵
  call: pd_payoff_build
- if: 单次且不可承诺
  call: nash_solve
- if: 需解释效率损失
  call: pareto_check
- if: 重复或可信承诺可行
  call: tit_for_tat
- if: 需跳出单次困境
  call: credible_commit
skills: []
negative_space:
- ⊗ 参与人须为自利理性人, 否则占优/均衡结论失效
