decision:
- if: 需构建收益矩阵
  call: pd_payoff_build
- if: 单次且不可承诺
  call: nash_solve
- if: 需解释效率损失
  call: pareto_check
- if: 重复或可信承诺可行
  call: tit_for_tat
- if: 需跳出单次困境
  call: credible_commit
