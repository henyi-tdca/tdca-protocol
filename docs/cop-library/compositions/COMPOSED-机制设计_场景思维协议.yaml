soul:
  identity: 机制设计 (Mechanism Design) ⟂ 场景思维协议 (Scenario Protocol)
  core: '给定期望社会目标, 设计规则/制度使自利理性人在均衡下的行为恰好实现该目标(激励相容); 是博弈论的反向工程 —— 不分析给定博弈, 而设计博弈本身；⟂解释项《场景思维协议
