decision:
- if: 需标定社会目标
  call: social_choice_target
- if: 需验证激励相容
  call: ic_check
- if: 需验证参与可行
  call: ir_check
- if: 需化简为诚实申报
  call: revelation_principle
- if: 需设计转移支付
  call: payment_rule_design
- if: 遇不可能性边界
  call: impossibility_aware
- if: 需最终执行检验
  call: implementation_verify
skills: []
negative_space:
- ⊗ 参与人须有私有信息且自利, 否则机制无设计对象
- ⊗ 社会目标须可量化形式化, 否则无逆推终点
- ⊗ 支付/外部性不可测则 VCG 类机制失效
- '⊗ 不可能性边界: 不存在 DSIC+非独裁+值域>=3 的确定性机制, 须取舍'
- ⊗ 机制须可被第三方可执行, 否则空设(不可信)
- '⊗ 禁止违反 NSFL: 伦理/法律负空间不可越'
- '⊗ 解释项负空间继承: 缺任一要素则场景不可自持/易崩'
