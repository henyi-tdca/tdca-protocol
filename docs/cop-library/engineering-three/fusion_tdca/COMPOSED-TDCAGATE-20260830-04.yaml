  note: '化合≠叠加: 叠加不改变属性只是两个独立思维的合作; 本 COP 的组合语义以 fusion_spec.attribute_changes 为证'
decision:
- if: 安全事件需不可抵赖留痕
  call: chain_evidence_watermark
skills: []
