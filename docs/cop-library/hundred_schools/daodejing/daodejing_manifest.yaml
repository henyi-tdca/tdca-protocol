  无为治国: 不尚贤/太上不知有之/治大国若烹小鲜/无事取天下/小国寡民
  用兵戒刚: 不以兵强/兵者不祥/善战不怒/不敢为主而为客(戒刚慎兵)
  修身认知: 致虚守静/自知自胜/知足/知不知/玄同/不出户知天下
strata_count:
