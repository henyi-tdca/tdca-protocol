items:
- n: 1
  title: 法
  cop_id: HS-FA-01-20260815-01
  stratum: 法度三器
  verse: 壹赏壹刑壹教，明法而治。法令者，民之命也，为治之本也。
  primitive: fa_du
  file: 第01条-法.yaml
- n: 2
  title: 术
  cop_id: HS-FA-02-20260815-02
  stratum: 法度三器
  verse: 术者，因任而授官，循名而责实，操杀生之柄，课群臣之能者也。藏于无事，示无为。
  primitive: shu_yu
  file: 第02条-术.yaml
- n: 3
  title: 势
  cop_id: HS-FA-03-20260815-03
  stratum: 法度三器
  verse: 贤未可必，而势位足以屈贤者也。尧为匹夫不能治三人，而桀为天子能乱天下。
  primitive: shi_wei
  file: 第03条-势.yaml
- n: 4
  title: 法术势合一
  cop_id: HS-FA-04-20260815-04
  stratum: 法度三器
  verse: 君执柄以处势，故令行禁止；法者，宪令著于官府；术者，藏之于胸中以偶众端。
  primitive: fa_shu_shi_he_yi
  file: 第04条-法术势合一.yaml
- n: 5
  title: 刑名参同
  cop_id: HS-FA-05-20260815-05
  stratum: 刑名权柄
  verse: 循名责实，综核名实。言事者必以其名效其实，功当其事，事当其言。
  primitive: xing_ming_can_tong
  file: 第05条-刑名参同.yaml
- n: 6
  title: 二柄
  cop_id: HS-FA-06-20260815-06
  stratum: 刑名权柄
  verse: 二柄者，刑德也。杀戮之谓刑，庆赏之谓德。为人臣者畏诛罚而利庆赏。
  primitive: er_bing
  file: 第06条-二柄.yaml
- n: 7
  title: 明主治吏不治民
  cop_id: HS-FA-07-20260815-07
  stratum: 刑名权柄
  verse: 圣人治吏不治民。吏者，所以治民也；明主治吏则官皆得其人。
  primitive: ming_zhu_zhi_li
  file: 第07条-明主治吏不治民.yaml
- n: 8
  title: 耕战
  cop_id: HS-FA-08-20260815-08
  stratum: 时变耕战
  verse: 国之所以兴者，农战也。利出于一孔，则国多物；出十孔，则国少物。
  primitive: geng_zhan
  file: 第08条-耕战.yaml
- n: 9
  title: 不法古不循今
  cop_id: HS-FA-09-20260815-09
  stratum: 时变耕战
  verse: 世异则事异，事异则备变。圣人不法古，不修今，因世而为之治。
  primitive: bu_fa_gu_bu_xun_jin
  file: 第09条-不法古不循今.yaml
- n: 10
  title: 自利人性
  cop_id: HS-FA-10-20260815-10
  stratum: 时变耕战
  verse: 人行事，非有名则利之也；挟自为心，故可得而用也。
  primitive: zi_li_ren_xing
  file: 第10条-自利人性.yaml
