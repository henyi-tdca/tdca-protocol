total_items: 10
strata_taxonomy:
  法度三器: 法/术/势/法术势合一 (明法任势用术, 三位一体立君道)
  刑名权柄: 刑名参同/二柄/明主治吏不治民 (循名责实, 赏罚双刃, 抓关键层级)
  时变耕战: 耕战/不法古不循今/自利人性 (利出一孔富强, 因时变法, 顺性设制)
