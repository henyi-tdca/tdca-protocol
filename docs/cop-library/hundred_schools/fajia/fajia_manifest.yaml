note: 法家以明法任势、循名责实为治术枢纽, 立君主南面之术与富强之基。逐条编译为独立可调用的思维协议(COP), 按三谱系归类。后续作'中国文化 ⊕ 辩证实践方法论'化合的中方基协议素材。
