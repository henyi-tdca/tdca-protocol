skills:
- 计篇·顺势研判
negative_space:
- ⊗ 不察而战：未行五事七计庙算即开战，违'不可不察'
- ⊗ 以诡道为正道：混淆'政治正道(令民与上同意)'与'用兵权道(诡道)'，二道不可互替
- ⊗ 庙算未胜而浪战：得算少/无算仍决战，直接否定篇旨
- ⊗ 五事七计失真：比较所依信息(道/将/法等)造假或被欺，庙算前提崩塌
- ⊗ 诡道溢出：权变用于政治正道领域(欺民/违盟)，越出战术负空间
