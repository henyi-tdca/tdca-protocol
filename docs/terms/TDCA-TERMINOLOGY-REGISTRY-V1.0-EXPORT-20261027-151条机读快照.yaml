- term: U-Vec
  def: Utility Observation Vector = (Attn, Dep, Log, Cre, SC)：效用观测向量（选项一）；选项二=严格沿用 S=(A=Awareness,D,L,C,SC) 不得改分量语义
- term: CLS
  def: Closed-Loop Settlement，闭环结算——多主体智能合约执行交易交付的资金清算金融服务机制（金融机构垫付+未来收入还款）；覆盖 C 端（消费贡献值）与 B 端（供应链金融）双场景（人类确认 2026-08-14）；排除微交付域——微交付（智能体间调用配置）不在
    CLS 场景：智能体无金融主体资质、支付权限由创建者赋予、杜绝欠款（即时对价）故无资金时序错配（人类裁决 2026-08-14 补注）；结算金融≠消费金融：C 端以消费贡献值/资金流数据参与闭环结算（稠密化），不为 C 端提供消费金融服务；消费金融函数（银行发布、C
    端定向支付+银行手续）= 银行↔C 端双边协议，可部署 TDCA 生态但不进 CLS 多主体闭环结算逻辑（人类裁决 2026-08-14 补注）
- term: GIM
  def: Generalized Industrial Marketplace，广义工业市场——扩展全品类供应链（不限定工业品；人类确认 2026-08-14）
- term: RTN
  def: Real-Time Netting，实时轧差——协议层清分逻辑；与 DVP 层级关系按 R-10 裁决（RTN 协议层 L2 轧差计算 → DVP 货币层 L0 交割；人类确认 2026-08-14）
- term: 五阶广义效用权利
  def: 可信数字版权资产五阶协同拟合：IP/知识/交换/场景权重/认知 NCA；U_total=f(U_ip,U_knowledge,U_exchange,U_scene,U_nca)；协同拟合非简单加总（详见存证件）；适用
    L3 生态正和验证层
- term: 通用配置权调度税
  def: 跨域/跨行业/复杂场景配置权调用税：1-3%（默认 2%）；风险溢价高/协商成本高/流动性低
- term: 供应链结算调度税
  def: 供应链金融标准化结算税：0.3-0.5%（默认 0.4%）；高频/标准化/税收锚定硬验证/风险趋近零
- term: CLS-Path
  def: 闭环结算实现路径三子类：存证件-A 微交付扩展（C 端）/ 存证件-B 银行结算函数（B 端）/ 存证件-C 聚合缴纳（G 端）；统一原型 Bank_Settle_Function(B,S,T,M,N)
- term: RTN（协议层轧差）
  def: Real-Time Netting：协议层（L2）多边应收应付矩阵轧差计算 → 净额清算指令（相关存证件生效后以其为准）
- term: DVP
  def: Delivery Versus Payment，货币层（L0）券款对付：数字人民币智能合约按净额自动划转
- term: MOU-Fuse
  def: MOU 熔断层级体系三子类：存证件-L1 单笔（MOU≤0 单笔 blocked）/ 存证件-L2 账户（连续 3 笔→配置权冻结）/ 存证件-L3 生态（连续 t 期低于 θ→市场暂停）；t=30 天，θ=0.70×历史平均
    MOU
- term: 清算资格惩罚（Settlement Qualification Penalty）
  def: '过错方在 TDCA 实时清算网络中的资格级惩罚——降级或取消参与清算系统资格；惩罚层级 L3（L1 单笔熔断 → L2 账户冻结 → L3 资格降级/取消）；触发条件: ①
    相关存证件 L2 冻结后整改不合格（期限内未整改）升级 ② 重大过错一次触发（欺诈性交付/恶意违约/挪用清算资金）；恢复机制: 整改 + 保险增信 + 治理委员会审核'
- term: 票款同步（Invoice-Payment Synchronization）
  def: NCA（票据）+ e-CNY 自动结算（付款）同一时刻发生——无时间差/信用风险/结算风险；融合双义：① DVP 条件支付（R-CLS-1）② NCA 凭证+同刻结算（R-CLS-4）；支付=结算+纳税同刻
- term: MOU 本体（Minimum Observable Utility）
  def: MOU = 进项税+出项税 = 交换效用的硬可见部分（详见存证件）；不是效用的度量而是场景效用可持续性的最低可见指标；不是天花板而是地板；不是目标而是熔断底线（MEMO-006 本体论 + 存证件 分层锚定：单笔必要条件
    MOU>0）
- term: 场景定义域 D_S（Scene Domain）
  def: D_S := Scene(场景) 全集（含退化场景）；相关存证件 场景外延集合化（含场景全三分量语义：条件组合 + f_s 效用函数量子单元 + MOU 最小边界单元）；场景标签函数值域
- term: 完备场景空间 D_c（Complete Scene Space）
  def: D_c = {s∈D_S |资格 ∧ 单一场景闭环 ∧ P_Dc}；资格=构成场景，四要素（A_NEST∧A_ASYM∧A_EMER）=完备条件（分层判定 （内部台账））
- term: 退化场景空间 D_degenerate
  def: D_degenerate = D_S \ D_c；资格成立但 P_Dc 未过的结构退化集合；与 相关存证件 场景负空间正交（结构退化 vs 意义维持，禁止互替）
- term: 组合级涌现剩余 ERI_c
  def: ERI_c = U(Compose(s_A,s_B)) − U(s_A) − U(s_B) > 0；涌现来源=共享/复用/交叉（A7 定义 4.33/4.34）；与权威 ERI 双义消歧（组合级 vs 主体级归一化，A7 定义 1.11）
- term: 场景间有向距离 q_D^{inst}
  def: quasi-metric 固定实例 = Σ_j w_j·max(0, x_j(s)−x_j(s')) + η·d_D^{sym}；微小性条款 sup ≤ δ/(1+η)（0<ε≤δ/(1+η)<δ<1）；公理 A_ASYM 实例
- term: 场景间距离对称化 sym_q
  def: sym_q = (q_D^{inst}(s,s') + q_D^{inst}(s',s))/2；≠ d_D^{sym}（d_D^{sym}=加权欧氏限制对称基底项，sym_q=显式对称化，禁止混用）
- term: 场景标签等价关系 ~_ε
  def: d_D^{sym} < ε 的传递闭包（图论语义）；跨场景边判定 s(u)≁_ε s(v)；对 R-CLS-1 定义 1（FROZEN）跨场景边判定的候选修改，须 （内部台账） / 转 R-SCENE-4
- term: 坐标归一化协议 φ_D
  def: D_S 坐标归一化至 [0, δ/(1+η)]^N（固定不可缩放）；微小性成为对场景坐标几何的非平凡约束
- term: 完备场景判定程序 P_Dc
  def: 元素级判定程序 = [资格 ∧ 闭环 ∧ A_NEST_layer ∧ A_ASYM_inst ∧ A_EMER_pair]；A_EMER_pair 存在量词为半判定（可构造验证，不可有限步证否）
- term: 完备场景/退化场景（分层判定术语）
  def: 资格 = 构成场景；四要素 = 完备条件；子集满足 → 退化场景；H1 修订版语义
- term: 跨场景环（Cross-Scene Cycle，定义 SC-2(v)）
  def: 含 ≥1 条 E_cross 边的有向环 ⟺ 顶点跨 ≥2 个 ~_ε 等价类；is_cross 检测时点语义 + 等价类版本化快照（equiv_class_version）；FROZEN 标签语义为 ε→0 极限（命题 4.1）
- term: R_ε 邻接图（定义 SC-1A）
  def: 无向图 (s(V), E_ε)，E_ε={{a,b}⊆s(V) |a≠b, d_D^{sym}<ε}；~_ε 等价类=连通分量；应用层 ~_ε 按 s(V) 图论传递闭包计算（活跃外标签不桥接）；与 相关存证件 的 R_ε 关系（D_S
    全域）消歧
- term: 商图 G/~_ε / 层间图 G_cross
  def: 降级为统计/可视化/索引辅助结构（零检测用途）；商图环=原图环必要非充分（不可拼接反例）；商图级 RTN 不保 T_net（推论 SC-6.3）
- term: 场景维边密度分解
  def: p = p_intra·ω_intra + p_cross·ω_cross；单场景口径（ω_intra=1）退化回 R-CLS-2 边密度 p（Erdős–Rényi 期望口径对齐）
- term: 跨场景成本 Q(C)
  def: Q(C) := Σ_{(u,v)∈C∩E_cross} q_D^{inst}(s(u),s(v))（基于 存证件 场景间有向距离）；量纲（场景距离）≠ δ×k（金额）须 ρ_Q 归一化；q_D^{inst}/π 条件性依赖
    SIMULATED
- term: 混合环销优先级策略
  def: score = ρ_save − λ·ρ_Q（归一化）；贪心启发非最优（U 为环销不变量）；0/0 退化约定 max Q=0 ⟹ ρ_Q≡0；Q2/π 单射前提
- term: 双层关系判据（定理 SC-7）
  def: 清算层债务环 ⇏ 配置层效用闭环；配置层效用闭环 ⇏ 债务环；推论 SC-7.2 跨场景清算先于/独立于跨场景配置（后者要求 D_c）
- term: E_cross（跨场景边集合）
  def: E_cross := {(u,v)∈E |s(u)≁_ε s(v)}（候选语义 + PENDING_SCALE 兜底双态）；对 R-CLS-1 定义 1（FROZEN）为候选修改，走 （内部台账）；判定属性静态→时点披露
- term: SC_s 度量协议（SCM-2.5）
  def: 'SC(s)=(∏ĥ_j^{w_j})×ρ 乘性-指数合成，SC: D_S→[0,1]；场景三态分类（活跃/沉寂/死）；= 依相关存证件 counter_evidence-1 G-5 缺口补全'
- term: 四因子可观测代理变量（SCM-2.1~2.4）
  def: ĥ_H 热度/ĥ_D 密度/ĥ_M 成熟度/ĥ_τ 衰减（A8 L1965 S_U 语义的代理实现候选，SIMULATED）；经宪法第 4 条可观测性过滤
- term: MOU 归零熔断状态机（SCM-2.6）
  def: MOU≤0 ⟹ S_U 权重归零 + P_C:=0（归零对象与 A8 L833 一致，SC 输出保留）；熔断-恢复状态机 ACTIVE/FUSED/COOLDOWN/RECOVERED
- term: SWU 定价分解（PCP-4.1/4.2）
  def: P_C(s)=MOU_s×SC_s×ERI(s)×irrepl(s) 乘性分解（无权威先例，草案语义标注）；μ_s≥1 正常路径/μ_s<1 熔断路径；irrepl 聚合+irrepl_min 准入阈值
- term: 场景权重 5 级层级结构（SCW-3.1）
  def: L-0 熔断/L-1 场景/L-2 主体/L-3 协作/L-4 资产；R_S→L-4、W_scene→L-2、S_U→L-1、SC→L-1、MOU 归零→L-0（候选统一映射）
- term: SWU 趋势离散差分条件（SCM-2.7）
  def: ΔSWU/Δ≥0 ⟺ g·SC+ΔSC/Δ+g·ΔSC≥0（严格等价式，无 O(Δ) 近似）；g_scene∈ℝ 允许负值
- term: 活跃度权重 w_a(s) 与场景级 irrepl(s) 聚合（R-8）
  def: w_a=IV(a,s)/ΣIV（可观测归一化）；irrepl(s)=Σw_a·irrepl(a,s)∈[0,1]；w_a ≠ W_scene（命名区分防混用）
- term: 子联盟值规则 v_s(S)（R-18）
  def: v_s(S)=MOU(S)·SC(s)·ERI(S)·irrepl(S)；一致性条件 C1~C3；退化规则 v_s:=0+STOCK_MOU_OVERRIDE；与 A8 L3206 联盟协作价值消歧（R-16）
- term: 负分配处置方案 A/B
  def: A=分配下限 0+熔断/审计 AUDIT_NEG_ALLOC；B=压缩式 x_a=φ_a·v(N)/P（Σx_a=v(N) 守恒）；L3206 总和语义候选；逐主体语义（A8 L1715）下负分配即协作熔断（裁决项 4 双语义并列）
- term: 执行层衔接方案 α/β 与差额会计路径（R-35/39/40）
  def: 方案 α 不进入分配层（差额=发行收入全额转熔断基金）/方案 β 规则重算值；差额借贷方向映射；熔断基金三通道注入
- term: SWU_s 满意解阈值 θ_SWU 定标流程
  def: 五阶段流程（沙盒实证→阈值候选→判别质量→人类批准→登记）；与 相关存证件 θ=0.70 指标对象不同可叠加；数值交 R-SCENE-5/6 定标
- term: 意义锚定度区间 M_A
  def: 'M_A: D_S→I([0,1]) 区间输出，乘性合成 ∏â_k^{w_k}（â_1 符号活跃度/â_2 认同度/â_3 自持度），0^0 ε_w 剔除单一约定；依相关存证件 BV-2 短板补全；三不可认识论处理（可观测代理非意义本身度量）'
- term: 意义维持约束 C_Y
  def: C_Y(s):=θ_Y−M_A(s)（区间差）；π_scene 条件性声明（H1-1/H1-2 ⟸ π_scene 存在性）
- term: 意义锚点维持阈值 θ_Y
  def: θ_Y∈(0,1)；联动 相关存证件 θ_SWU 定标（指标对象不同可叠加）
- term: 意义可维持域 Ω_Y / Ω_Y^CONS
  def: Ω_Y={s'∈N_ρ|M_A^->θ_Y} 开集；Ω_Y^CONS=N_ρ∩{C_i(π_scene)<0}∩{M_A^->θ_Y}（H1-2 防 BV-4 交集定义，构造成立）
- term: 场景负空间临界带 ∂Ω_Y
  def: ∂Ω_Y={s'∈N_ρ|M_A^-≤θ_Y≤M_A^+}（双端含等号，退化点归临界带，引理 Ω-1.2 三分完备）；与 A7 定义 2.2 结构类比/语义对齐（非同构）
- term: 边界演化算子 Λ_Y / Λ_MA
  def: Λ_Y=逐点区间演化+阈值重组（五维交互 ξ_s 驱动）；E-3b Λ_MA 端点序-值域双投影（引理 E-3.1 良定性）
- term: 场景五维交互状态向量 ξ_s
  def: ξ_s=(T,P,E,A,Cnt) 时间/地点/事件/相关人群/内容事物；ξ_s.A 与四符号体系 A 分量符号重用消歧（OVERLAP-R3-2）
- term: 触发符号体系 ΔM_A^{cand,±}/ΔM_A^{det}/v^±
  def: 候选增量（E-3a 中间量）vs 检测差分（投影后 M_A^- 序列差分，状态机触发专用）；单端/双端语义区分
- term: 保守判定协议 P-DEC
  def: 三分：可维持 M_A^->θ_Y / 临界 M_A^-≤θ_Y≤M_A^+ / 消亡 M_A^+<θ_Y；退化点归临界带；反转点退化为「区间包含阈值即临界带」
- term: 意义消亡熔断状态机 MFS
  def: MEANING_ACTIVE/DECAY/FUSED/RECOVERED/SILENT/RECONSTRUCT/DECLARE_DEAD + SUSPENDED_PENDING_REVIEW/FUSED_REVIEW_PENDING；反转期挂起；升级机制（Δt_suspend/Δt_review/Δt_confirm/k）；与
    相关存证件 分层联动（意义层 vs 制度层，独立触发/并行运行/防 BV-4 越层）
- term: 审计标记族 AUDIT_INVERSION/AUDIT_SATURATION
  def: 端点反转/值域截断诊断标记；与 相关存证件 AUDIT_NEG_ALLOC/SHRINK 同属 AUDIT_* 命名族（对象差异声明）
- term: 场景化合运算 Compose_op
  def: D_S^k→𝒫(D_S) k 元化合；三通道 Ch_share/Ch_res/Ch_info（对齐 A7 定义 4.34 涌现三通道）+ 化合序 σ；合闭性（通道∧ERI_c^(k)>0∧P_Dc 三查∧闭环 ⟹ s_C∈D_c）
- term: 沙盒受控子空间 Sandbox_Scene
  def: '{s∈D_S |simulated(s)=True ∧ s∈Θ_sandbox ∧ Boundary_sandbox(s)}；隔离性 State_sandbox∩State_production=∅（宪法 6.35/6.36 实例化）'
- term: 沙盒-出盒闭环状态机 SandboxSM
  def: 五元组 (Q,Σ,δ,q_0,Q_term) 9 态（INBOX/SIMULATING/EXIT_PENDING/PROMOTED/ROLLBACK/FUSED/REINBOX + 例外子状态 PROMOTED_OBSERVING/PROMOTED_AWAITING_REVIEW）；PROMOTE
    动作标签；三元势 Φ=(r,ap,rf)；T_cool 同名异义消歧（转正后 vs 存证件 熔断后）
- term: 出盒判据两段式门控 Gate_exit
  def: Gate_compute（AC_inst>1.2 ∧ QuadCheck ∧ SWU_pos ∧ M_A^->θ_Y）∧ Gate_governance（SEA_Pass ∧ HUF）；宪法 6.41 四重检验超集扩展（四重检验完整包含）
- term: 模拟→真实 MOU 衔接协议 Bridge_MOU
  def: MOU_sim→MOU_real 转正三组分重算；dev_MOU 方案 A（sf 固定入判据，对齐权威 6.16）/B（直接比较）；差异窗口披露声明；MOU_real=0 除零→相关存证件 归零熔断优先
- term: 激活系数统一形式 AC_inst
  def: 权威 AC=(Tax_out+SS)/PCR_in>1.2 按求值域实例化（α_virtual 沙盒内/α_physical 真实域）；语义消歧非新公式；两份相关存证件 补登记建议
- term: k 元组合级涌现剩余 ERI_c^(k)
  def: 组合级涌现剩余 ERI_c（k=2）自然推广；k 元化合涌现判据；待注册表修订确认
- term: SEA 合规前置 SEA_Pass
  def: 方案 B 二元合规门槛（全单项>0∧治理评估通过，非数值判据）；方案 A（保留数值+尺度协议）为 FROZEN C7 语义修订候选——两方案并列交人类+法学家裁决
- term: 映射补登记（激活系数↔沙盒三位一体↔权威 AC）
  def: 映射补登记新增条目（激活系数 ↔ 沙盒三位一体 ↔ 权威 AC）；随注册表 V1.9 一并推进
- term: 联合演化算子 Λ_SA
  def: 权重泛函 SC_s（场景权重协议）×意义边界 ∂Ω_Y（意义边界）联合演化（受控确定性演化）；扩展状态空间 X''=X×Ξ×G×Σ×V×H_ξ；A8 L1561/L1965 场景权重动态性形式化实现；交叉驱动项 W←M（单侧
    logistic）/M←W
- term: 一致解域 K_cons
  def: 三阈值（θ_Y/θ_SWU/第三阈值）联合可行参数组集合；候选 [0.45,0.75]×(0,1]×[0.65,0.75]（[0.45,0.75] 为草案 SIMULATED 候选）；构造性 P*=(0.65,0.50,0.70)
- term: 自适应触发信号分类与分层分发协议 D_trigger
  def: S_SWU^trig/S_M^trig/S_C^trig/S_X^trig 四类→归属映射至 两处相关机制/SandboxSM（非单射分派表）；防 BV-4 越层
- term: 自适应-等价类时序耦合协议
  def: 演化批次=版本冻结窗口 [v,v+k]；Λ_SA 触发 equiv_class_version+1（R-SCENE-4 时点语义承接）；跨窗口精度函数 F(k) 联动
- term: 自适应势 Ψ
  def: Ψ_n=SWU_s(x_n) 数值势；与三元势 Φ=(r,ap,rf) 角色分离（Ψ 连续数值势非承载终止性，Φ 离散计数势承载状态机终止性）
- term: 交叉驱动项 W←M/M←W 与 Λ_SA^ext
  def: W←M 单侧 logistic 降权（1/(1+e^{(M_A⁺−θ_Y)/ε})）/M←W 协调项；Λ_SA^ext=X''×O→X''×O 反馈闭环
- term: 自适应步长参数族 + 平滑算子族
  def: η_w/λ/γ_M/ζ/ρ_ξ 步长参数 + σ_ε（tanh 符号平滑）/1_ε（单侧 logistic）/Ξ_evol（推断算子）+ 批处理窗口 k
- term: 空化规则（∂Ω_Y=∅ 处置）
  def: 演化步内意义边界空化：方案①（推荐）终止步+MFS DECLARE_DEAD/方案② 扩展度量 d_H^ext（值域 [0,1]，∅ 孤立点）
- term: 受控输入接口与收敛条件
  def: B_obs/g 外部观测输入（不进入状态维）；收敛条件三选一（①常数输入/②u_n→u* 推荐/③非自治框架）；Lipschitz 前提 L_u<∞（限输入连续域）
- term: 历史缓冲维 H_ξ 与全帧度量 d_Ξ
  def: d_Ξ=Σ_{k=0}^{m}ρ_hist^k·d_ξ（m+1 项加权和，ρ_hist∈(0,1)）；公理 2.4 非退化性全帧恢复
- term: 正则域 X_c^reg
  def: 自适应正则域（显式排除判据临界集 J_{判据临界集}=0/M_A⁺=θ_Y）；∂U_A/B（输入切换边界）与 X_c^reg 域解耦
- term: 输入度量 d_U 与观测缓冲度量 d_B
  def: d_U=|g_1−g_2|+d_B；d_B 全帧加权（m_B+1 帧）；路径 B（推断）域 B_obs=∅、d_B:=0 定义域闭合
- term: 跨窗口精度函数 F(k)
  def: d_SA''(x_{v,k},x_*(v))≤F(k)；候选 O(1/k)/O(e^{−αk})（SIMULATED 待定标）
- term: MOU_ε（R-SCENE-2 定标参数补登记）
  def: MOU 阈值下界（MOU_s<MOU_ε 不计算 g）；g 计算域防护 vs 相关存证件 制度归零两层消歧；溯源 R-SCENE-2 REV-007 R-6
- term: 场景形成机制一·设计主导（M1）
  def: 有意义构建主体设计场景 → 围绕场景组织交互要素 → 初始主题意义强维护 → 后续演变；理论锚点=SandboxSM 出盒（两份相关存证件）+ M_A 强维护（相关存证件）+ ∂Ω_Y 强约束（相关存证件）；实证：高起点直接高信任均衡
- term: 场景形成机制二·自组织涌现（M2）
  def: 主题意义模糊，弱设计弱维护，后期靠涌现共识固化（ECS）→ D_degenerate→D_c 跃迁（R-SCENE-1 遗留动态化）；理论锚点=ERI_c（详见存证件）+ 权威涌现判据（A7 4.34）；实证：ECS 双机制逃脱（共识跃迁×集体维护缺一不可）
- term: 场景形成机制三·先设计后涌现（M3）
  def: 设计主导 → 后期涌现演化（渐进让位保留意义维持底线 ∂Ω_Y 不放弃）；理论锚点=SandboxSM PROMOTED（相关存证件）→ Λ_SA（相关存证件）；实证：骤变放弃维护→坍缩，渐进保留→成功
- term: 场景形成机制四·先自组织后强运维（M4）
  def: 自组织涌现固化 → 逐步强运维（治理升级）；理论锚点=ECS 跃迁 + 意义维护升级（详见存证件）+ MFS（详见存证件）+ SandboxSM 纳入；实证：ECS 跃迁 + 强运维成功
- term: 涌现共识固化 ECS
  def: 自组织场景中累积涌现（ERI_c）与协作共识（N_c）固化为可维护主题意义的过程；D_degenerate→D_c 跃迁条件（存证件 定理 ECS-D1 四条件：ECS 达标/四要素补全/意义锚定 M_A≥θ_Y/正和保持）；=
    SCTPF 声誉惯性 lam 的机制化
- term: 共识跃迁（ECS 分量一）
  def: ECS 触发时场景权重结构性跃迁 SC += Δ_ECS·(1−SC)（D_degenerate→D_c 可信跃升）；共识强度足够突破正反馈临界（实证：ecs_delta≥0.5）
- term: 集体维护增强（ECS 分量二）
  def: ECS 触发后维护强度增强 d *= (1−maint_boost)（共识达成后群体共同维护，意义维持 存证件 强化）；实证：maint_boost≥0.3（无维护被弱维护拖垮）
- term: 场景依存 COP 效用（U_CDE）
  def: U_CDE(c|s) = U0(c)·SC(s)·A(c,s)——COP c 在场景 s 中的场景依存效用（基准效用×场景权重×适配因子）；A∈[0,1] 非负标度（反适配=正交 A→0）；U 记号与五维价值向量 V=(U,S,F,C,R)
    的 U 分量强制消歧（人类裁决 2026-08-16）
- term: 制度思维协议（制度 COP）
  def: 将 TDCA 制度层（宪法十六条/ID 原理簇/NSFL 规则）编译为 COP 形式（存证件-{date}-{seq} + 生态强制门 enforce_entry.py）；编译=映射不改制度文本（详见存证件）；强制门走来源工作区独立存证链
- term: 场景 COP（SCEN-COP）
  def: 将场景画布六要素建模为 COP 的场景范式思维协议（场景组织者携带，经 MCP 搜索比配主动组局）；相关存证件 场景的 COP 派生（画布六要素=建模模板，SCEN-COP=可执行协议）
- term: COP 编译器
  def: 将专家知识/范式文本编译为 COP 形式化包（六要素+NSFL+NCA）的自动化引擎；三层架构（词法 CP BNF/语法 schema/语义效用+负空间继承）；编译族并列成员（L1 函数语料/L2 COP/L3 制度注入 + 相关存证件
    + NSFL 编译器）
- term: 可计算审计还原验证器（f⁻）
  def: 'f⁻: Y×X→{0,1}——制度函数 f: X→Y 的审计验证器：f⁻(f(x),x)=1（完备性）；f⁻(y,x)=1 ⟹ y=f(x)（可靠性）；公理 6 核心载体；EIOS Auditor = f⁻ 实现（定理 7.1）；NCA
    确权充要条件（定理 8.4）；f⁻ 为验证器（返回 {0,1}）非严格反函数 f⁻¹，排除哈希单向/黑盒'
- term: 右逆还原函数（g）
  def: 'g: Y→X——∀y∈Im(f)，f(g(y))=y（右逆，非严格反函数；多对一 f 可还原）；公理 6 约束 3；存在性充要 = f 满射（定理 E.3）；配置权 φ(g(φ(x)))=φ(x)（定理 2.2）；右逆 ≠ 左逆；f⁻
    唯一、g 可多选（"验证强于还原"，定理 E.2）'
- term: 函数五可属性
  def: 可观测（定义域）/ 可计量（值域）/ 可配置（参数）/ 可审计（右逆 f⁻）/ 可熔断（NSFL）——五可属性谓词；定理 8.8（百亿规模协作可持续 ⟺ 五可成立）；宪法十六条属性函数化提炼；五可是属性谓词非四要素效用分解；"可审计"为公理
    6 新增维度
- term: 制度函数化充要性
  def: 制度可执行 ⟺ 可表示为函数（定理 1.1 双方向证明）；白皮书函数第一性原理根基；与 相关存证件 函数隐喻（FM，TERMS-001）分层——FM 为隐喻层、本概念为充要性定理层，不冲突
- term: f⁻ 复杂度上限（C_max）
  def: 公理 6 约束 4 定标值：C_max = O(16·c(x)) = O(n)（SIMULATED 候选，R6）；判别规则 ρ = P(T(f⁻) ≤ T(Verify)) ≥ 0.95；五阶段流程对齐 存证件；待真实审计基准库实测（详见存证件）
- term: 函数大模型（F_IM）
  def: 'F_IM: A_inst×R→D∪{BLOCKED}——以制度公理为基座、函数映射为范式、可计算可审计为信任来源的模型物种；规范性语料必然执行；TDCA 第二层护城河；与 相关存证件 编译器层级消歧（物种 vs 工具）'
- term: 制度孪生（Φ_IT）
  def: 'Φ_IT: L_inst→F_exec——将制度逻辑本身作为孪生对象，函数化编译生成可计算可验证可演化的数字镜像；独立于数字孪生的元概念；与 相关存证件 定理层消歧；全球无人区确认'
- term: 语料属性分野
  def: 参数大模型与函数大模型的本质分野在语料属性（描述性 vs 规范性），非架构；三阶语料论核心
- term: 规范性语料
  def: 封闭必然规范驱动的语料（制度公理/宪法/NSFL/MOU）；认知范式=必然执行（MOU）；与法律文本区分（已编译规则）
- term: 描述性语料
  def: 开放概率经验驱动的语料（自然语言/代码/对话）；认知范式=统计拟合（P）；根本局限=幻觉
- term: 外部制度锚定
  def: 将信任验证锚点外迁至制度层的方法论（外部税收硬数据破解自指悖论）；方法论层 vs MOU 机制实例层
- term: 制度主义范式
  def: 继符号主义/统计主义后的第三范式（制度同构/函数协议化/可信协作拓扑）；外部锚定破解哥德尔困境；家国天下文化本源
- term: 函数大模型（FLM）
  def: 显式函数工件构成/调用化合推理/可审计声明性约束信任——泛范畴（FLM⊇F_IM，相关存证件 为制度化实例）——与 PLM 垂直互补非对立；裁决：信任机制=抽象层（制度锚定为实例层选项）
- term: 参数大模型（PLM）
  def: 权重矩阵载体/采样推理/幻觉错误模式——与 FLM 垂直互补栈——相关存证件 描述性语料统计拟合载体；领域通称的 TDCA 定义口径
- term: 编译（Compile）
  def: 隐会思维→函数工件的知识生产协议；同构映射=约束声明层结构保真（非输出等价，签批可驳回为质量控制层）——FLM 生产协议，相关存证件 为其编译器角色实例；与 两份相关存证件 工具层/分层
- term: 蒸馏（Distill）
  def: PLM 间知识迁移协议；同态映射=约束语义对象可逐层无声剥离（定义性缺陷）——相关存证件 批判对象，与 Compile 分层不竞争
- term: 消费贡献参与（CCA）
  def: Consumption-Contribution Access——C 端自然人真实消费以可验证信号进入配置权市场需求侧的正式通道；is_extension_of=相关存证件（贡献值复用其 C 端消费贡献值）+ 需求侧参与新扩展；参与权=等级化（创始人
    2026-09-08：自然人场景配置权可升级——观察/投票/回馈等级随真实贡献提升，非交易化）；不可约四禁（不可转让/不可交易/不可兑现现金/无升值承诺）；回馈跨场景折现以场景互认为前提按互认规则执行（无互认禁止）；CCA≠CCP（详见存证件）；signals
    D_scene 接入 P_C 属 M2
- term: 场景需求信号聚合（D_scene）
  def: D_scene(t)=Σ_i CCA_i(t)×w_scene——消费贡献值经场景权重加权聚合为场景级需求信号（上链可核）；关联 相关存证件 场景/相关存证件 SWU（w_scene 同源，SIMULATED）；与 两份相关存证件
    D_S（场景定义域集合）消歧：D_scene=需求信号聚合函数值≠场景空间集合；采纳判据=配置生产响应率≥阈值（SIMULATED，慢系统）；资助检测防伪信号；接入 P_C 属 M2 λ_pair
- term: 混合配置市场（HCM）
  def: Hybrid Configuration Market——智能体/自然人/人类组织三类主体分侧身份进入同一 L2 配置权空间的配置交易结构（需求侧信号→供给侧生产→撮合调度→生态反哺闭环）；范围=身份分侧+角色结构（结算接缝/跨轨违约/定价接入归
    M2）；结构约束：智能体与自然人/组织配置/交付关系仅 1:1 与 1:N、禁 N:N（创始人 2026-09-08；N:N 未来若需单独立项）；生态反哺为独立新机制（不称 royalty，DP-5）；撮合服务费≠调度税（详见存证件）；≠
    GIM
- term: 主体对制度完备度调节系数（λ_pair）
  def: v_s^pair(S)=v_s(S)×λ_pair(pair_type)——作用于 1:1/1:N 供给侧单主体可分配配置价值（分配层，不进入 P_C 定价条目 之定价公式）；差额预扣 (1−λ)×v_s → 熔断基金（该存证件之
    方案 α，创始人 DP-M2-8 选定）；候选值域：机机/人-组织/组织-组织=1.0 基准、混合 D-org 0.90~1.0、D-person 0.75~0.90（SIMULATED 待 M3 定标）、人-人=不适用（DP-1）；失败条件：M3
    后 D 类 <0.95 无人类解释→机制降级；禁裸 λ（λ 族消歧：λ_risk/λ_freq 结算侧 τ、裸 λ＝两份相关存证件 已占）；只缩不放
- term: 场景互认（SMR）
  def: 场景 s_i/s_j 互认关系 R(s_i,s_j)——四条件（D_c∧SC 非死合取[防 κ 除零]/共享上下文或显式声明登记生效/无负空间触碰[锚 相关存证件/017/073]/制度层登记含 相关存证件）；跨场景折现系数
    κ=min(SC(s_j)/SC(s_i),1)×ρ_ij（κ≤1 硬约束只缩不放；ρ_ij=互认置信∈(0,1]≠ρ(s) 时间衰减）；无 R 则折现禁止 fail-closed；族内聚合去重+衰减（D_scene 防重复计）；is_extension_of=相关存证件
    + 相关存证件 族内扩展
- term: 观测权（Observation Right）
  def: 主体对特定范围内的 AI 资产实施合规观测的资格与权利束；要件三项（备案登记 / 被观测 / 受宪法十六条约束）；示意 ObsR(u,S)=Registered(u)∧Auditable(u)∧Constraint16(u)∧Scope(u)⊆Licensed(u)。裁决修正（DP-07）：①
    默认被动观测 ② 主动仅国家强制情形 ③ 申请才观测 ④ 第三方公信力主体实施（非自测）⑤ 须备案 + 被观测 + 宪法十六条。消歧：制度资格（含被观测对价）≠ 技术权限（数据访问权）；显式排除"先验授权"。母件 §八 第二十条之二
- term: 待立法沙盒（Pending-Legislation Sandbox）
  def: 现行法律未覆盖的技术发现在研究区内的沉淀容器；硬约束三（仅沙盒内研究沉淀 / 不得升格为对第三方强制约束 / 与 NSFL 双向映射）。裁决修正（DP-08）：① 法无禁止则可为 ② 是否立法非 TDCA 范畴 ③ 生态规则严于现行法律。消歧：不含豁免语义（≠
    监管沙盒）；与绝对负空间 ⊗ 互斥。母件 §二 + §七 第十五条 注
- term: 合规观测节点（Compliance Observation Node）
  def: 经备案、承担合规观测职能、并接受被观测审计的观测主体或设施单元；第三类受审计主体（与特许对象、仪器实现并列）；属性四元 {身份, 职能, 审计链, 状态∈{active,suspended,revoked}}。裁决修正（DP-09）：①
    资格由国家公器授予（非 TDCA）② 非公器授予者 TDCA 拒绝 ③ TDCA 仅形式核验与存证、不产生资格 ④ 节点责任不豁免机构责任。消歧：被审计方 ≠ 监管节点（审计方）。母件 §四 第八条 + §十 第二十五条之一
- term: 影子 AI 转化率（Shadow-AI Conversion Rate）
  def: 治理成熟度指标 ShadowConvRate =|Confirmed|/|Discovered|；Discovered=进入 PUCR 通道的发现数，Confirmed=经正和评估转正确权者（熔断上报者计分母不计分子）；取值域 [0,1]；分母
    0 → ND（未采集），不得填 0 或 1。裁决修正（DP-10）：① 不作准入指标（准入以 §六 第十三条五项为限，无比率项）② 不作资格判定依据 ③ 保留治理过程观察指标，须并列绝对量，禁止单列比率。消歧：≠ 商业转化率（专指"发现→确权"的制度转化）。母件
    §八 第十八条 + §六 第十三条 注②
- term: 主题意义
  def: 场景赖以成立并被持续呈现的意义内核；可经迁移／解构／再重构（相关存证件）；须以 M_A（相关存证件，可观测代理）计量——⚠️ 代理 ≠ 意义本身；来源：创始人 2026-09-17 明示 ＋ 新课题 相关存证件
- term: 三类交互（信息／物质／能量）
  def: 场景内外交互的三个通道：信息交互／物质交互／能量交互；场景持续 ⟺ 三类交互以主题意义的逻辑持续发生（详见存证件）；⚠️ 与 存证件「交互要素」的重叠关系待核
- term: 最小配置单元
  def: 可作为最小单元直接参与配置的单元（即场景）；内部要素不直接参与配置；越级 ⟺ 该要素即另一场景的元函数（详见存证件／C-SP-1）；落地交办 存证件（（内部台账））
- term: 协作可信效用指数（CCI）
  def: 刻画协作主体之可信效用的指数；在函数白皮书 §4.5 权重函数中与生态声誉指数ERI 并列进入 W_a = h(ERI_a, CCI_a)（§4.5 定义 4.5）。⚠️ 规范全称唯一为「协作可信效用指数」（依据 （内部台账），创始人
    2026-09-18 逐字裁定「协作可信指数 --- 改为协作可信效用指数」）；⛔ 论丛 026 族所配自定全称「协作复杂度指数」不构成其规范全称，自 2026-09-18 起 ⛔ 不再以该名指称本条目。⚠️ 定标状态：未定标（值域与指数化待指数化方案口径；⛔
    未定标前不得用于对外件或正空间）
- term: 协作结构指标
  def: 对窗口 W 内之实例主体集 V_inst（n =|V_inst|），以有向协作关系集 E ⊆ V_inst × V_inst 计算之结构密度：d =|E|/ (n·(n−1))；⚠️ V_type = {H, M, L} 仅为关系类型标签集，⛔
    不参与分母；⭐ 方向语义：a → b ＝ 发起方指向（a 发起、b 受）。输入形态：|E| ＝ 窗口内已去重之有序协作对数；空间 O(1) 仅在输入为已去重快照时成立，现场去重则 O(|E|)。取值域与退化：⭐ 取值域 [0,1]；n
    ≤ 1 → ND（未采集），⛔ 不得填 0 或 1；⚠️ 实际可达上界 < 1（待定标）。报告纪律：引用须与 n、|E| 并列，⛔ 禁单列比率；⛔ 不可与无向密度直接比较（对称协作按方向各计 1 条）。命名依据：创始人 2026-09-18
    逐字裁定（「协作复杂度指数 --- 改为协作结构指标」）。⭐ 消歧：⛔ 与 CCI（协作可信效用指数）非同项、不得互认；⭐ 与「协作拓扑」（结构本身，承 AUTHORITY-ECONOMICS 定义 1）严格分层（本条目 ＝ 结构之度量）；⭐
    旧名「协作复杂度指数」最初系于 CCI 符号下使用，自 2026-09-18 起自该符号剥离并更名为本条目现名。排除项：⛔ 不得替代场景三态判定（详见存证件）；⛔ 不得替代或修饰 MOU（仅为可计前提，fail-closed）；⛔
    不承担定标流程（归 存证件 五阶段）；⛔ 不得与 CCI／「协作拓扑」互称；⛔ 不得用作新的准入门槛，亦不得用作资格判定／权利归属之依据。术语增量陈述：⭐ 本术语之价值在作用域绑定与制度消歧，⛔ 不在算子独创（算子即标准 network
    density，本侧仅固定「有向计数」口径）。前提：加权度中心性之启用前提 ＝ 权重表先定标；本算子准则适用域 ＝「边集已可得、已去重、追加式更新前提下」。定标状态：SIMULATED（窗口 W 候选值与可达上界待定标，照存证件
    体例）。未尽项：论丛 026 其余版本复核、窗口 W 定标详表、相关存证件 限用项全文复核
- term: 场景形式化表达（SFE）
  def: 'Scene Formal Expression——场景可以用函数来作形式化表达：函数 ＝ 对场景作形式化表达之手段（语言），场景 ＝ 被表达之对象；⭐ 定位＝表达关系层（承 （内部台账） 三层贯通链：场景 → 表达形式＝函数 →
    元函数 ⟷ 解释项 → 协议表达位）；⭐ is_related_to = 相关存证件（对象 vs 手段，⛔ 非重叠定义）；⭐ 与 两份相关存证件／配置权权威条目（𝒞ℛ 七元组／𝒫₃）分层，⛔ 不改其公理地位；⭐ 与函数白皮书定律
    L1（场景为函数之输入）与定义 2.1（F_TDCA: A×R×S×T→U）互为表里（同义异述）。误读排除：⛔ 不得读作「函数是场景的表达形式」（该式已由 （内部台账） 改述，⛔ 不再单用）；⛔ 不得读作「场景由函数产出」；⛔ 不得读作「场景仅有函数一种表达形式」。版本要求：⭐
    仅人读（（内部台账）；⚠️ 日后对外须对外发布前再审，届时可能升级三件套）。来源链：（内部台账）／2313／2314／2315（附页 AMEND-4）／2316／2317／2318／2319／2320／2321'
- term: 最终受益人（Ultimate Beneficiary）
  def: ⭐ 委托链穿透到底后所指向之最终责任主体（链上每一跳"代表谁"⟶ 末端之"谁"）；⭐ 定位＝归因责任层（⭐ 与"执行体"相对：一为谁做、一为谁负责）；⭐ 来源＝①之 Root Entity（⚠️ 该英文词 ⛔ 不采用为规范全称，因与在册术语体系用语不一）；落地承接
    （内部台账）。⚠️ 与 相关存证件 配套（其三问之一）
- term: 三元归因（Triad Attribution）
  def: ⭐ 任意一条动作记录须可回答三问：谁执行（执行体）／代表谁（最终受益人 存证件）／谁负责（责任人）；⭐ 三问齐备方称"归因成立"；⭐ 定位＝归因审计层；⭐ 验收线＝5 分钟内可答三问；⭐ 来源＝① §三 字段表（agent_id／on_behalf_of／owner）
- term: 固锚级（拟 Fixed-Anchor Tier，待审）
  def: ⭐ 设备唯一 ＋ 物理地址保持（钉在那儿不动）⟹ 身份可信等级第一档（最高）；来源＝创始人签批 （内部台账）＋条例第 5、6 条
- term: 移锚级（拟 Movable-Anchor Tier，待审）
  def: ⭐ 设备唯一 ＋ 物理地址可移（能搬）⟹ 第二档；来源同上
- term: 记名级（拟 Named-Account Tier，待审）
  def: ⭐ 仅注册实名认证账号（设备不唯一；⭐ IP 仅辅助）⟹ 第三档；来源同上
- term: 未达门槛（拟 Below-Threshold，待审）
  def: ⭐ 匿名 ⟹ ⭐ 读作「未达可信门槛」（⛔ 非「非法」、⛔ 免贬义定性；⭐ 匿名 ≠ 没有身份）；处置＝不纳入定档 ＋ 不接纳入网；来源同上
- term: 待补（拟 Pending-Supplement，待审）
  def: ⭐ ⭐ 仅 IP（其余可信信息缺）⟹ 判告警 ＋ 要求补料，补足后方可重判；⭐ ⭐ 过渡态（⛔ 非档）；⭐ 告警 ≠ 未达门槛；⭐ 消歧＝⛔ 不与在册泛用「待补（材料／项）」混同；来源同上
