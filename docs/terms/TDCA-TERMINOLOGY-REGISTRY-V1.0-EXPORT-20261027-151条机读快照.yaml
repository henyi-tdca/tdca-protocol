- term: J-Vec
  def: J-Receivable 资产特征向量 = (AG, Dur, LR, CS, TC)：AG=Asset_Grade{AAA..BBB} / Dur=Duration(天) / LR=Liquidity_Rate(年化) / CS=Credit_Score[0,1]
