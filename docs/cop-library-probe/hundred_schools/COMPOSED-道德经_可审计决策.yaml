    ⊕ 马克思主义''化合的中方基协议; 本协议须以 TDCA-CORE-20260815-01 (生态准入基协议) 为可信底座, 经 NCA 确权、受 NSFL 护栏、依 MOU 正和底线运行。；⟂解释项《可审计自主决策协议 (Auditable Autonomous Decision Protocol)》(核心: 把人类自主决策的原则编译为智能体可执行的门控决策协议: 决策门→原语状态机→下游skill调度→NCA确权→NSFL护栏→可回滚;
    全程可追溯, 人类只需审计不必理解。这是 COP 作为''自主决策源泉层''的方法本体。)：自主决策须以''道法自然''为元准则: 决策门不只判进/退/待, 更须顺因循理、不强为——在必败/不可逆情境主动''不退而待''转为顺势蓄势; 原语状态机调度下游 skill 时遵循无为而治:定方向放权、不代庖, 让 skill 自组织执行; NSFL 护栏即''道''之红线(逆道妄为即熔断)。可审计顺势自主决策:
    人类审计的是''是否顺道 + 是否留痕 + 是否守底线'', 而非逐条指令。'
