  file: 第02条-指物论.yaml
- n: 3
  title: 白马非马
  cop_id: HS-MG-03-20260815-03
  stratum: 离坚白
  verse: 白马者，马与白也，马与白非马也。求马，黄黑马皆可致；求白马，黄黑马不可致。
  primitive: bai_ma_fei_ma
  file: 第03条-白马非马.yaml
- n: 4
  title: 坚白论
  cop_id: HS-MG-04-20260815-04
  stratum: 离坚白
  verse: 坚白石二。视不得其所坚，拊不得其所白。坚白离焉，不相盈也。
  primitive: jian_bai_lun
  file: 第04条-坚白论.yaml
- n: 5
  title: 通变论
  cop_id: HS-MG-05-20260815-05
  stratum: 离坚白
  verse: 二无一，左与右可谓二。鸡足一，数足二，二而一。
  primitive: tong_bian_lun
  file: 第05条-通变论.yaml
- n: 6
  title: 合同异
  cop_id: HS-MG-06-20260815-06
  stratum: 合同异
  verse: 大同而与小同异，此之谓小同异；万物毕同毕异，此之谓大同异。
  primitive: he_tong_yi
  file: 第06条-合同异.yaml
- n: 7
  title: 历物十事
  cop_id: HS-MG-07-20260815-07
  stratum: 合同异
  verse: 至大无外谓之大一，至小无内谓之小一。天与地卑，山与泽平。
