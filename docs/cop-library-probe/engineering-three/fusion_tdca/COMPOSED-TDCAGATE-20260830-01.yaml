  emergence: '新思维: 化合即门控——admission/sandbox/production 不是挂在协议上的流程, 而是化合判据的可执行投影; 负空间拥有绝对否决权 (安全底线不经表决), 但否决非终审——触犯实体走四态动态处置 (休眠/禁止/重塑/出清), 随负空间演化可重评, 拒绝的刚性与处置的动态并存'
base_protocol: TDCA-CORE
composition_policy:
  standalone: false
  tdca_native: true
  mandatory_base: TDCA-CORE (TDCA 体系内强制遵守, 不可配置关闭)
  detachable: 剥离 TDCA 治理层后协议语义保持独立自洽, 可移植至其他治理体系
  note: 思维协议不是独立发挥作用的, 须与系列内其他 COP 组合调用 (用户裁定 2026-08-30)
  constitution: 'NSFL 否决权 (F1.5, 用户裁定 2026-08-30 21:07): 对于任何无法通过 NSFL 预检的事件 (负空间触碰), 即使其他四判据全部通过, 亦视为整体拒绝 (Fail-Closed); NSFL 预检的优先级永远高于其他四判据——负空间是安全宪法的宪法, 不可配置关闭, 不可被多数判据推翻。四态动态处置 (F1.5b, 用户裁定 2026-08-30
    21:19): TDCA 是动态管理, 负空间本质保守不轻易变化但仍会演化——现在触犯不等于永远触犯; 否决权的不可推翻性仅指即时门控裁决, 不指永恒身份; sandbox 检验触犯负空间的实体走四态处置: 休眠/禁止/重塑/出清 (裁定 NCA 存证, 禁悬置), 负空间版本更新时休眠/重塑态强制重评。'
  bind_policy: 解释项绑定关系为运用层配置, 运行期允许换绑 (dispatch.graph 可扩展)
soul:
  identity: TDCA门控总装
  core: NSFL 否决权 (F1.5) 恒居首 + 三道门各五判据可机验, fail-closed 禁跳门, 门控行为全量 NCA 存证
  role: TDCA 原生系列思维协议 (化合层, 新思维)
  category: 工程三协议化合 / TDCA门控总装
primitives:
- name: tdca_gating_assembly
  method: 'TDCA门控总装 (化合产物, 属性已改变: 门控的存在形态: 04 协议中的描述性映射 (阶段↔门的对应表)→可机验判据集+fail-closed 强制——门控从描述变为执行体; 过门凭证: 评审口头结论→五判据全过+NCA 存证——凭证从信任变为证据; NSFL 预检的地位: admission 五判据之一 (与四判据并列)→F1.5 否决权 (宪法之上还有宪法)——恒居决策树第一步,
    未过即整体拒绝并短路其余判据, 优先级不可被推翻、不可配置关闭)'
  signature: 'fn tdca_gating_assembly(fused: CompoundContext) -> EmergentOutcome'
  precond: '化合前置: 智能体/协议需跨门迁移 (反应物 COP 已就位且组合性强制成立)'
  postcond: 'NSFL 否决权 (F1.5) 恒居首 + 三道门各五判据可机验, fail-closed 禁跳门, 门控行为全量 NCA 存证 (涌现达成: 新思维: 化合即门控——admission/sandbox/production 不是挂在协议上的流程, 而是化合判据的可执行投影; 负空间拥有绝对否决权 (安全底线不经表决), 但否决非终审——触犯实体走四态动态处置 (休眠/禁止/重塑/出清),
    随负空间演化可重评, 拒绝的刚性与处置的动态并存)'
  negative_space: ⊗ 禁口头过门; 禁门控判据不可机验即放行; 禁 NSFL 否决权被多数判据/场景豁免/上级指令推翻; 禁否决后不进四态处置 (悬置)
  steps:
  - 'F1.5 否决权预检 (恒第一步): NSFL 预检未过→整体拒绝并 NCA 存证, 其余判据短路不评 (Fail-Closed, 优先级高于一切)'
  - 'F1.5b 负空间四态处置 (否决后必接, 禁悬置): sandbox 检验触犯负空间的实体按四态裁定——休眠 (保留待负空间演化重评) / 禁止 (当前负空间下永久拒入) / 重塑 (改造至合规后重走门) / 出清 (清出体系并留链); 裁定本身 NCA 存证, 负空间版本更新时休眠/重塑态强制重评'
  - admission 五判据 (场景界定/灰靶标签/画布FMEA/NSFL预检/NCA就绪, NSFL 项受 F1.5 否决权管辖)
  - sandbox 五判据 (惟一差异/正交筛选/RGT态/涌现监控/MOU校验)
  - production 五判据 (RQT复验/区组发布/FRACAS激活/阶段监控/配置权路径)
  - fail-closed 禁跳门 (含否决权触发即三门口径整体拒绝)
  - 门控行为 NCA 存证
  nca_emit: true
