fusion_spec:
  fusion_type: 化合
  verdict_rule: 化合=改变属性、产生新思维; 叠加不改变属性、只产生两个独立思维的合作。本 COP 声明 fusion_type=化合, 以 attribute_changes 为证; 无属性改变的组合须降级标注为合作。
