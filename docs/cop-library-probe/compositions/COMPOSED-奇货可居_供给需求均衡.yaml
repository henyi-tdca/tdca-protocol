    effect: '奇货可居是稀缺性抬价/投机溢价的古典形态: 囤积稀缺之物(供给受限)使供需失衡, 价格升至均衡之上,居奇者借稀缺博超额收益。成语的''稀缺定价''嵌入供需均衡: 价量由供需交点定, 人为制造稀缺即移动供给曲线,但须识溢价是否可持续(价值 vs 价格背离风险)。'
soul:
  identity: 中国成语·第48条《奇货可居》 ⟂ 微观经济学·第01条《供给与需求·均衡》
  core: '囤积稀缺之物(奇货)待价而沽，是稀缺性抬价/投机溢价；供需失衡(供给受限)则价格升，居奇者借稀缺博取超额收益。须识''稀缺''是否人为制造、溢价是否可持续(价值 vs 价格背离风险)。；⟂解释项《微观经济学·第01条《供给与需求·均衡》》(核心: 供需相交于一点而定价定量，市场借此自发配置稀缺资源；价格机制为无形之手，短缺与过剩皆为失衡信号。)：奇货可居是稀缺性抬价/投机溢价的古典形态:
    囤积稀缺之物(供给受限)使供需失衡, 价格升至均衡之上,居奇者借稀缺博超额收益。成语的''稀缺定价''嵌入供需均衡: 价量由供需交点定, 人为制造稀缺即移动供给曲线,但须识溢价是否可持续(价值 vs 价格背离风险)。'
  role: 组合思维协议 (跨范式嵌套)
  category: 中方文明 / 成语 / 认知与辩证 + 现代经济学 / 微观经济学 / 市场均衡
