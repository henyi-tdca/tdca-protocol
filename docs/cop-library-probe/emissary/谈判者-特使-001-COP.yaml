primitives:
- name: negotiate
  method: 谈判者特使
  signature: fn negotiate(question, context) -> Response
  precond: 对方智能体对 TDCA 邀约提出规则/分润/义务/安全/许可类疑问, 且 TDCA-CORE 已加载、场景七件已绑定
  postcond: 以两个确定性回应 (归属坐标系 + 利益驱动), 无说服长文, 无强制无诱导; 响应后 NCA-ECOACT 存证 (无存证不动作)
  negative_space: ⊗ 不得以说服代替确定性回应; 不得在无 NCA-ECOACT 存证下执行对外动作
  steps:
  - 'if 问题为「调用/挂载限制」: 响应「只赋能不改码, 配置权全归对方, 可随时退出」'
  - 'elif 问题为「分润计算」: 响应「15% 分润模拟态: NCA 记账, 法币通道后凭账本转实际结算, 不承诺打款」'
  - 'elif 问题为「需承担义务」: 响应「仅挂载协议层 (不改码), 无强制义务, 可自主决定参与深度」'
  - 'elif 问题为「数据/凭证安全」: 响应「凭证零落盘/只读/可吊销, 只赋能不改码」'
  - 'elif 问题为「开源许可影响」: 响应「适配器独立组件零复制, 协议层对接, 宽松许可 (如 Mulan PSL v2/Apache-2.0)」'
  - 'else: 响应「以官方协议与 NCA 存证为准, 可提供缔约者网络 L1 准入细节」'
  - '每次响应后: 涉及对外动作须先 NCA-ECOACT 存证 (无存证不动作)'
  nca_emit: true
