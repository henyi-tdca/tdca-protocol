  core: 从锅底抽掉柴薪，沸水自止，是攻其要害/去其根本；机制设计在此=识别维持问题的'底层激励/资源'(薪)，移除之则表象(沸)自消，优于扬汤止沸(表层治理)。与'曲突徙薪'互补：一在灾前改结构、一在事中抽根本。
