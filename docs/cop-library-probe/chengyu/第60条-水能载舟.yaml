  identity: 中国成语·第60条《水能载舟》
  core: 统治者(舟)依托民众(水)而存，水既能载亦能覆，是民本/正和协作的古典隐喻——治理的正当性与可持续性来自被治者的承载，须以'载'代'覆'(顺下、处下如江海百谷王)。荀子·王制原典，此处以'民本承载'锚定正和协作底线。
  verse: 君者舟也，庶人者水也；水则载舟，水则覆舟。
