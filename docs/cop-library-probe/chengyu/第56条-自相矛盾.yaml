  core: 同时主张'矛无不陷'与'盾不可陷'，两言互伐、逻辑不能共存，是逻辑矛盾；矛盾论视之为'同一性与斗争性'失当——只斗(互相否定)而无同一(可共存语境)，故陈述自破。须消解表述中的互斥断言。
  verse: 以子之矛，陷子之盾；无不陷与不可陷，两言相伐。
