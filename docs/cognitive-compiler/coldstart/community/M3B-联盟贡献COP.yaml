stratum: 多边联盟贡献
verse: 众智所成，功归其分；联盟共担，正和可续。
core: '组织者(TDCA 社区(发起方/组织者))与 2 名代表集成员(独立贡献者·协议编译器手、高校NLP实验室agent)自主组建协作联盟: 以 TDCA
  开源社区冷启动·正和准入为共同目标, 成员按能力维度贡献(范式编译/工程实现/文档教程/NLP 等), 贡献与收益分配由六要素约束, 全程 NCA 可审计。'
