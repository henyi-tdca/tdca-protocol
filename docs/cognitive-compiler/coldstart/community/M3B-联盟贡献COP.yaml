- 不得违反数据合规（隐私/伦理/授权范围）
- 不得剽窃或冒名署名
- 不得单方越权使用联盟资源
- 不得转向零和掠夺(NSFL 熔断)
primitive: fn form_coalition(organizer, members) -> CoalitionCommit
soul:
  base_protocol: TDCA-CORE-20260815-01
dispatch: 多边联盟组建 / 多代表集候选并行准入时触发
decision: '目标函数: max(正和协作产出 | 主题=TDCA 开源社区冷启动)

  约束矩阵: [数据合规] [署名规则: 贡献者署名] [授权: 联盟内共享]

  配置权边界: 资源仅限联盟目标使用; 成果归属按贡献确权

  预期分配: Shapley 按贡献分配署名/收益(模拟态 NCA 记账)

  审计轨迹: 每阶段产出 NCA 落链(准入/联盟/生产)

  if 任一方 φ<BATNA: -> BATNA 存疑熔断(禁止生产)

  '
topic: 联盟模板 · 多边联盟组建(M3b)
