  identity: 中国成语·第57条《画龙点睛》
  core: 画龙成而点睛则破壁飞去，是'关键一笔'使整体活化；在已备的系统中注入决定性要素(如机制设计关键杠杆)，使潜质转为现实。须辨'睛'之所在——点错则龙不飞(类纲举目张但重在'激活'而非'统御')。
  verse: 龙成而未睛，一点乃飞；要害既点，全体皆活。
  origin: 唐·张彦远《历代名画记》：张僧繇于金陵安乐寺画四龙不点睛，云'点睛即飞去'，人以为妄，固请点之，须臾雷电破壁，二龙乘云去。
