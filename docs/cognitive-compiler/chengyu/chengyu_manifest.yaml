library: chengyu
role: 中国成语思维协议·成语库 (中方文明思维精粹, 故事沉淀的具象化思维单元)
note: 成语是古人思维的精粹, 多由一个历史故事或现象凝练为一句精炼汉语表达, 是高度凝练的文本。逐条编译为独立可调用的思维协议(COP), 每条含 verse(精炼表达)/core(所编码的思维协议)/origin(出处与故事梗概)/negative_space(误用边界)。与诸子百家互补——诸子为体系化义理, 成语为具象化思维单元; 与三十六计/微观经济学并列作 TDCA 中方化合基库素材。
base_protocol: TDCA-CORE-20260815-01
compiler: chengyu/compile_chengyu.py
schema: 同构麦肯锡 COP (stratum+steps+origin, 兼容 compose_general)
status: compiled  # 2026-08-27 实编完成, 60 条 COP 全部通过全量审计 (两批)
total_items: 60
strata_taxonomy:
  战略与决断: 完璧归赵/负荆请罪/纸上谈兵/卧薪尝胆/草木皆兵/破釜沉舟/暗度陈仓/退避三舍/一鸣惊人/唇亡齿寒 (博弈/谈判/时机/承诺) + 田忌赛马/鹬蚌相争/合纵连横/远交近攻/假道伐虢/围魏救赵/杯酒释兵权/徙木立信/纲举目张/居安思危 (第二批·博弈/联盟/地缘/机制/可信承诺)
  认知与辩证: 塞翁失马/守株待兔/刻舟求剑/掩耳盗铃/画蛇添足/盲人摸象/杯弓蛇影/庖丁解牛/邯郸学步/井底之蛙 (辩证/归纳/认知边界/顺应规律) + 知己知彼/物极必反/相反相成/否极泰来/举一反三/格物致知/买椟还珠/奇货可居/因地制宜/开源节流 (第二批·信息/辩证/认知/经济)
  修身与治理: 一诺千金/滥竽充数/愚公移山/精卫填海/闻鸡起舞/三顾茅庐/萧规曹随/指鹿为马/朝三暮四/防微杜渐 (信用/机制/韧性/治理/确权) + 量入为出/集思广益/三思而行/曲突徙薪/叶公好龙/自相矛盾/画龙点睛/对症下药/釜底抽薪/水能载舟 (第二批·预算/聚合/风险/名实/逻辑/激活/精准/民本)
