      category: ECONOMIC
      priority: 5
      formalization: 𝒜_protocol 独立调度 𝒜_human 与 𝒜_machine
    - id: ID79
      name: MOU 最低可见效用
      category: ECONOMIC
      priority: 5
      formalization: MOU = Tax_in + Tax_out；连续无税收则场景权重归零
    - id: ID81
      name: 五元拓扑空间
      category: COGNITIVE
      priority: 5
      formalization: Ω=(V,E,T,G,μ) 道路连通
    - id: ID82
      name: 蒸馏批判与跃进原理
      category: TECHNICAL
      priority: 4
      formalization: 制度同构跃进 ψ≠Distill；接口熵=0
    - id: ID85
      name: NSFL 负空间函数语言
      category: INSTITUTIONAL
      priority: 5
      formalization: ⊗禁止/⊘限制/⊙观察；三不可三可原则
    - id: ID86
      name: LEGAL 绝对熔断
      category: INSTITUTIONAL
      priority: 5
      formalization: LEGAL ∧ HARD → alt=∅
    - id: ID91
