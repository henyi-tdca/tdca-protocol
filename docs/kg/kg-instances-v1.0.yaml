      text: 解决制度与技术同构问题，使机机交互可信安全
      enforcement_level: HARD
      applicable_scenes:
      - 全场景
      ota_version: v1.0
    - article: 0
      title: 宪法序言-零摩擦运用
      text: 让所有主体零摩擦运用，合规时隐形越界时刚性
      enforcement_level: HARD
      applicable_scenes:
      - 全场景
      ota_version: v1.0
    - article: 0
      title: 宪法序言-资源整合
