      priority: 3
      formalization: 同一主体不可同时持有冲突的协议层角色
    - id: ID68
      name: Protocolizer 协议化引擎
      category: TECHNICAL
      priority: 4
      formalization: 将制度框架编译为可执行函数语料
    - id: ID71
      name: 快与慢战略
      category: INSTITUTIONAL
      priority: 4
      formalization: 快系统确定性自动化 + 慢系统人类价值判断
    - id: ID76
