<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDCA 官网 · 四层架构制度橱窗</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 旧地址兼容（SITE-SEO-A-001 乙-1）：历史模式启用前的老 #/xxx 深链接
      // 自动跳到对应新地址（保留至少一个版本周期）；裸路径直访与刷新由
      // 部署面 nginx try_files 回退到本页（⛔ 本令不部署），此处不再改写裸路径。
      (function () {
        var h = location.hash;
        if (h.indexOf("#/") === 0) {
          var t = h.slice(1);
          location.replace(t.indexOf("?") === -1 ? t + location.search : t);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
