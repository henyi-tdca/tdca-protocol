  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 新功能交付须带三行卡(数据账/对外面/运维), 缺一行即判在建
- id: n0047
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 宿主 bind mount 面（静态根目录／单文件配置）一切写入须保 inode：禁 sed -i、禁 mv 改名替换；改后须「容器内实读 ＋ 改前备份 di…
- id: n0048
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 凡页面或清单自称「不公开／仅授权可见／内部」者, 须匿名实测其可达性; 匿名可得实质内容即为不一致, 须登记并按层处置
- id: n0049
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: '废止任何在册规则或口径, 须附反复三要素: 废止理由 / 环境变化 / 重启触发; 缺一不得废止'
- id: n0050
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: '变更与重启须可追: 有件号、有链记录; 无记录者不认'
- id: n0051
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 结论须可复现(有判据或工具可重跑); 不可复现者只能称「据报」, 不得称「已核」
- id: n0052
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 同一件名连追补（追加件）不得超过 2 次; 第 3 次须重出整件并指名取代前件
- id: n0053
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: '立条（新制度条/新判据/新规则）前须先过「四分法」四问: 主体 / 客体 / 边界 / 与既有条之关系'
- id: n0054
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 涉模型、测算、推演的件, 须先列现实约束不少于三项, 再写目标与结论
- id: n0055
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: '抽象名词（能力、效用、场景、锚、净面等）在件内首次使用时须落到具体载体: 指哪件、哪表、哪字段、哪目录'
- id: n0056
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: '挂起项必写三要素: 因（为何挂）/ 触发（什么条件下重启）/ 谁解挂（责任方）; 缺一不得挂起'
- id: n0057
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 凡引用「已通读」「已精读」「已全覆盖」者, 须标实际覆盖比与算法; 不得以件名族统计充作通读
- id: n0058
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 判据宽严标准不明时, 只报区间（宽/严两算）与两算之差, 不得报单一取值
- id: n0059
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 引用任何数字（件数、条数、比数）须给实测时点与实测命令或来源件; 不得只写结论数
- id: n0060
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 出件前须先答「本件属承接口径表哪一条主线」，并清其阻塞三问（谁阻塞／阻塞什么／如何解除）; 两问答不出者判旁枝件
- id: n0061
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 凡取舍（方案选择／两案取其一等）须附三段：取此之理由／不取之代价／可改之条件; 缺一段即判不完备
- id: n0062
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 件合格＝出件前自检器全过（无 FAIL; WARN 须件内说明或当场修）; 未跑器或跑而未列读数者, 判未验
