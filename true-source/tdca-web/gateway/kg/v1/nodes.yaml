  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 立判据或定存量时, ⛔ 以单一写法（单一命名式/单一计数式/单一口径）作为存量定义; 须双向或多口径并陈并写明口径差异; 只写单一口径者判不可判
- id: n0064
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
