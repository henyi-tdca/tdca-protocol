- id: n0065
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 遇「行为回退／判据被抹」，须先核改动方向与提交面（diff 方向、是否由同步／归一／镜像类工序造成），再定归因；⛔ 直接归因模型或开发者动机
- id: n0066
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 同步／镜像／双副本类提交须显式报「谁刷谁」（源与目标）与方向；⛔ 只报「已同步」
- id: n0067
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 凡作为证之 CI 闸门，其所依赖之外部库／工具链须锁版本；未锁者该闸门结论 ⛔ 跨环境复现、⛔ 作证
- id: n0068
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 无 CI 门禁之子系统，其测试结论与通过率 ⛔ 采信、⛔ 用于对外表述；须先补门禁或明标「无门禁·不计入」
- id: n0069
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 评估第三方报告之数字指控（虚标／不符），须先定检索口径与抓取面（时点、分支、排除面、字段名），再判成立与否；两口径有差者并列报出
