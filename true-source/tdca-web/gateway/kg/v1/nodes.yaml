  type: FunctionSpec
  type_name: 规范与判据与术语
  label: 余量与计数须当场实测复算, 不得引旧注释或旧件的数字
- id: n0040
  layer: L1
  layer_name: 协议规范层
  type: FunctionSpec
  type_name: 规范与判据与术语
