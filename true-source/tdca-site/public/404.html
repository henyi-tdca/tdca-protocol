<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>页面不存在 · TDCA 三体可视化中心</title>
<style>
  :root {
    --navy-0: #0A1830;
    --navy-1: #0E2142;
    --navy-2: #12305E;
    --gold: #C9A45C;
    --gold-light: #E8CD8F;
    --ink: #E2E8F0;
    --muted: #94A3B8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--navy-0) 0%, var(--navy-1) 55%, #081222 100%);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 520px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(201, 164, 92, 0.35);
    border-radius: 14px;
    background: rgba(18, 48, 94, 0.28);
    padding: 48px 36px;
    box-shadow: 0 18px 60px rgba(4, 12, 28, 0.55);
  }
  .code {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--gold-light);
    line-height: 1;
  }
  .rule {
    width: 56px;
    height: 2px;
    margin: 20px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
  p { font-size: 13px; line-height: 1.9; color: var(--muted); }
  .actions { margin-top: 28px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a {
    display: inline-block;
    padding: 9px 22px;
    border-radius: 8px;
    font-size: 13px;
    text-decoration: none;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    transition: background 0.15s ease;
  }
  a:hover { background: rgba(201, 164, 92, 0.14); }
  a.primary { background: var(--navy-2); }
  a.primary:hover { background: #1a3f78; }
</style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <div class="rule"></div>
    <h1>页面不存在或尚未上线</h1>
    <p>您访问的地址没有对应的内容页。<br />可能是链接已调整，或该功能仍在建设中。</p>
    <div class="actions">
      <a class="primary" href="/">返回首页</a>
      <a href="/library">浏览知识库</a>
      <a href="/help">使用帮助</a>
    </div>
  </main>
</body>
</html>
