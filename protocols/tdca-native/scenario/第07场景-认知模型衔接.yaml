  - 定义事件 schema
  - 订阅分发
  nca_emit: true
- name: shared_metadata
  method: 共享元数据管理
  signature: fn shared_metadata() -> meta_store
  precond: 术语存在歧义
  postcond: 建核心术语词典+元数据同步机制, 统一语义基底
  negative_space: ⊗ 术语不一致致认知距离扩大
  steps:
  - 建核心术语词典
  - 设元数据同步
  - 校验一致性
  nca_emit: true
- name: bidirectional_empower
  method: 双向赋能协同
