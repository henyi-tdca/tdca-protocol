  - 建协同决策模块
  - 定冲突解决策略
  nca_emit: true
- name: joint_eval_ab
  method: 效果评估体系(A/B测试)
  signature: fn joint_eval_ab(experiments) -> eval_report
  precond: 存在衔接方案待评估
  postcond: 以联合评估指标+A/B测试框架验证衔接流畅性与双向赋能价值
  negative_space: ⊗ 无评估则衔接价值不可见
  steps:
