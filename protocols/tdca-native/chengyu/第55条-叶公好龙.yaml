  core: 表面爱龙、真龙降临却惊走，是名实不符/虚伪之好；所好者'龙之符号'非'龙之实'。须辨'所宣称'与'所真迎'，防止以姿态代实质(与买椟还珠同属名实之辨，此重在'好'之真伪)。
