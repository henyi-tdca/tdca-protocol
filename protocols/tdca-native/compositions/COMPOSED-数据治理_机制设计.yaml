composition_policy:
  standalone: false
  tdca_native: true
  mandatory_base: TDCA-CORE (TDCA 体系内强制遵守, 不可配置关闭)
  detachable: 剥离 TDCA 治理层后协议语义保持独立自洽, 可移植至其他治理体系 (设计目标)
