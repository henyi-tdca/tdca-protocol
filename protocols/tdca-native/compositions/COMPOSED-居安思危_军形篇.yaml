soul:
  identity: 中国成语·第40条《居安思危》 ⟂ 孙子兵法·第04篇《军形篇》
  core: '在安稳时预想危局、先立不可被胜之形，待机而动；是''先为不可胜''——修道保法、藏于九地，胜可知而不可为，无恃其不来。把风险前置为常态准备，而非临渴掘井。；⟂解释项《孙子兵法·第04篇《军形篇》》(核心: 先为不可胜——先立不可被胜之形(修道保法、藏于九地)，待对方可胜之机；胜可知而不可为，无恃其不来。)：居安思危''安不忘危、先立不败之形''正是军形篇''先为不可胜, 以待对方之可胜''的生活化:
    修道保法、藏于九地,胜可知而不可为, 无恃其不来。成语的''先为不可胜''嵌入军形: 把风险前置为常态准备(立于不败且待对方之败),非临渴掘井。'
  role: 组合思维协议 (跨范式嵌套)
